{# Manager order entry form - Ultra Compact Quick-Action Edition #}

<style>

/* =========================================================
   MODAL / PAPER ANIMATION
   ========================================================= */

.of-modal-overlay {
    opacity: 0;
    transition: opacity .28s ease;
}

.of-modal-overlay.pm-active {
    opacity: 1;
}


/* The order form starts at the FAB and grows outward */

.of-modal-card {
    position: relative;

    transform-origin:
        calc(100% - 28px)
        calc(100% - 28px);

    transform:
        perspective(1600px)
        translate(0, 180px)
        scale(.055)
        rotate(-7deg)
        rotateX(-18deg);

    opacity: 0;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #fffefa 100%
        );

    border-radius: 18px;

    box-shadow:
        0 2px 5px rgba(28,25,23,.05);

    transition:
        transform .62s cubic-bezier(.16,1.25,.28,1),
        opacity .20s ease,
        box-shadow .55s ease;

    will-change: transform, opacity;
}


/* PAPER COMES OUT */

.of-modal-card.pm-in {
    transform-origin:
        calc(100% - 28px)
        calc(100% - 28px);

    transform:
        perspective(1600px)
        translate(0,0)
        scale(1)
        rotate(0deg)
        rotateX(0deg);

    opacity: 1;

    box-shadow:
        0 35px 90px rgba(28,25,23,.24),
        0 12px 30px rgba(28,25,23,.12);
}


/* PAPER GOES BACK INTO BUTTON */

.of-modal-card.pm-out {
    transform-origin:
        calc(100% - 28px)
        calc(100% - 28px);

    transform:
        perspective(1600px)
        translate(0,150px)
        scale(.07)
        rotate(-6deg)
        rotateX(-15deg);

    opacity: 0;

    box-shadow:
        0 2px 5px rgba(28,25,23,.05);

    transition:
        transform .36s cubic-bezier(.55,0,.85,.35),
        opacity .20s ease;
}


/* Subtle paper highlight */

.of-modal-card::before {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    border-radius: inherit;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.78),
            transparent 32%
        );

    opacity: .55;

    z-index: 100;
}


/* =========================================================
   BACKDROP
   ========================================================= */

.of-modal-overlay {
    background:
        rgba(6,78,59,.18) !important;

    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
}


/* =========================================================
   ADD ORDER FAB
   ========================================================= */

.add-order-fab {
    position: fixed;

    right:
        max(
            1.1rem,
            env(safe-area-inset-right)
        );

    bottom:
        max(
            1.1rem,
            calc(
                env(safe-area-inset-bottom)
                + .5rem
            )
        );

    z-index: 40;

    width: 54px;
    height: 54px;

    border-radius: 18px;

    border:
        1px solid
        rgba(255,255,255,.7);

    background:
        linear-gradient(
            145deg,
            rgba(16,185,129,.97),
            rgba(5,150,105,.97)
        );

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 12px 30px
        rgba(5,150,105,.25),
        0 4px 10px
        rgba(28,25,23,.12);

    transition:
        transform .25s cubic-bezier(.2,1.3,.3,1),
        box-shadow .25s ease,
        border-radius .25s ease;
}

.add-order-fab:hover {
    transform:
        translateY(-3px)
        scale(1.03);

    box-shadow:
        0 16px 36px
        rgba(5,150,105,.30),
        0 6px 15px
        rgba(28,25,23,.14);
}

.add-order-fab:active {
    transform: scale(.93);
}


/* FAB becomes an X while paper is open */

body.of-order-open .add-order-fab {
    transform:
        rotate(45deg)
        scale(.82);

    border-radius: 50%;

    box-shadow:
        0 5px 15px
        rgba(5,150,105,.18);
}

body.of-order-open .add-order-fab:hover {
    transform:
        rotate(45deg)
        scale(.86);
}


/* =========================================================
   QUICK ACTION AREA
   ========================================================= */

.of-quick-wrap {
    position: relative;
    z-index: 100;
}

.of-chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
}

.of-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;

    height: 36px;
    padding: 0 11px;

    border-radius: 9999px;

    border: 1px solid #e7e5e4;
    background: #fff;

    font-size: 11.5px;
    font-weight: 700;

    color: #57534e;

        background .15s ease,
        border-color .15s ease,
        color .15s ease,
        transform .15s ease,
        box-shadow .15s ease;

    user-select: none;
    white-space: nowrap;
}

.of-chip:hover {
    border-color: #a8a29e;
    background: #fafaf9;
}

.of-chip:active {
    transform: scale(.97);
}

.of-chip-icon {
    font-size: 14px;
    line-height: 1;
}

.of-chip-dot {
    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #059669;

    display: none;

    margin-left: 1px;
}

.of-chip.of-filled {
    border-color: #a7f3d0;
    background: #ecfdf5;
    color: #047857;
}

.of-chip.of-filled .of-chip-dot {
    display: inline-block;
}

.of-chip.of-open {
    background: #1c1917;
    border-color: #1c1917;
    color: #fff;

    box-shadow:
        0 5px 14px
        rgba(28,25,23,.16);
}

.of-chip.of-open .of-chip-dot {
    background: #fff;
}


/* =========================================================
   PAYMENT CHIP
   ========================================================= */

/* =========================================================
   FLOATING FIELDS
   ========================================================= */

.of-floating-field {
    position: absolute;

    left: 0;
    top: 50px;

    width:
        min(
            430px,

}

.of-floating-label {
    display: block;

    padding:

    font-size: 9px;
    font-weight: 800;

    letter-spacing: .06em;
    text-transform: uppercase;

    color: #a8a29e;
}

.of-floating-input {
    width: 100%;
    height: 38px;

    border:
        1px solid
        #d6d3d1;

    border-radius: 10px;

    padding:
        0 11px;

    color: #292524;

        border-color .15s ease,
        box-shadow .15s ease;
}

.of-floating-input:focus {
    border-color: #059669;

    box-shadow:
        0 0 0 3px
        rgba(16,185,129,.08);
}


/* =========================================================

   ========================================================= */

.of-form-background {
    position: relative;

    transition:
        filter .22s ease,
        opacity .22s ease,
        transform .22s ease;
}

.of-form-background.of-background-blur {
    filter: blur(5px);

    opacity: .30;

    transform:
        scale(.995);

    pointer-events: none;
}


/* =========================================================
   PAYMENT
   ========================================================= */

.of-payment-content {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 100%;
}

.of-mark-paid-btn {
    width: 100%;
    min-height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 8px;

    border:
        1px solid

    background:
        #f5eee8;

    color:
        #9a5b32;

    font-size: 12px;
    font-weight: 800;

    cursor: pointer;

    transition:
        background .18s ease,

.of-mark-paid-btn.of-paid:hover {

.of-mark-paid-icon {

.of-mark-paid-btn.of-paid

}


/* Real checkbox */

}


/* =========================================================

}

.of-payment-date .wp-trigger {

.of-payment-date

.of-payment-date
.wp-trigger.of-filled,

.wp-trigger.of-filled span,
.of-payment-date
.wp-trigger.active span,
.of-payment-date

        #57534e !important;
}


/* =========================================================

    position: absolute !important;

    width: 1px !important;

}

/* =========================================================

<!-- =========================================================
     ORDER MODAL
     ========================================================= -->

<div
    id="orderFormModal"
    class="fixed inset-0 z-50 hidden bg-emerald-950/40 backdrop-blur-sm no-print flex items-center justify-center p-3 sm:p-5 of-modal-overlay"
>

    <section
        id="orderFormSection"
        class="bg-white w-full max-w-4xl max-h-[92vh] overflow-y-auto rounded-2xl shadow-2xl border border-stone-200 relative of-modal-card"
    >

        <!-- HEADER -->

        <div
            class="sticky top-0 bg-white/95 backdrop-blur-md z-40 px-4 py-3 border-b border-stone-100 flex items-center justify-between"
        >

            <h2
                class="section-title text-emerald-800 text-sm font-bold flex items-center gap-2"
            >

                <span
                    class="p-1 bg-emerald-100 rounded-lg text-sm"
                >
                    📝
                </span>

                新账单快速录入

            </h2>


            <button
                type="button"
                onclick="closeOrderModal()"
                class="w-7 h-7 flex items-center justify-center rounded-full bg-emerald-50 hover:bg-emerald-100 text-emerald-800 transition-colors cursor-pointer"
            >

                <span class="text-sm font-bold">
                    ✕
                </span>

            </button>

        </div>


        <!-- FORM -->

        <form
            id="orderEntryForm"
            action="/add_order"
            method="POST"
            enctype="multipart/form-data"
            onsubmit="handleFormSubmit(event)"
            class="p-4 space-y-3 text-sm font-sans"
        >

            <input
                type="hidden"
                name="return_qs"
                id="addOrderReturnQs"
                value=""
            >


            <!-- =================================================
                 QUICK ACTIONS
                 ================================================= -->

            <div
                class="of-quick-wrap"
                id="ofQuickWrap"
            >

                <div class="of-chip-row">


                    <!-- SOURCE -->

                    <button
                        type="button"
                        class="of-chip"
                        data-field="source"
                        onclick="ofQuickAction('source')"
                    >

                        <span class="of-chip-icon">
                            🏷️
                        </span>

                        <span>
                            来源
                        </span>

                        <span class="of-chip-dot"></span>

                    </button>


                    <!-- CUSTOMER -->

                    <button
                        type="button"
                        class="of-chip"
                        data-field="customer"
                        onclick="ofQuickAction('customer')"
                    >

                        <span class="of-chip-icon">
                            👤
                        </span>

                        <span>
                            客人
                        </span>

                        <span class="of-chip-dot"></span>

                    </button>


                    <!-- ADDRESS -->

                    <button
                        type="button"
                        class="of-chip"
                        data-field="address"
                        onclick="ofQuickAction('address')"
                    >

                        <span class="of-chip-icon">
                            📍
                        </span>

                        <span>
                            地址
                        </span>

                        <span class="of-chip-dot"></span>

                    </button>


                    <!-- DATE -->

                    <button
                        type="button"
                        class="of-chip"
                        data-field="date"
                        onclick="ofQuickAction('date')"
                    >

                        <span class="of-chip-icon">
                            📅
                        </span>

                        <span>
                            日期
                        </span>

                        <span class="of-chip-dot"></span>

                    </button>


                    <!-- DELIVERY FEE -->

                    <button
                        type="button"
                        class="of-chip"
                        data-field="fee"
                        onclick="ofQuickAction('fee')"
                    >

                        <span class="of-chip-icon">
                            🚗
                        </span>

                        <span>
                            车费
                        </span>

                        <span class="of-chip-dot"></span>

                    </button>


                    {% if show_payment %}

                    <!-- PAYMENT -->

                    <button
                        type="button"

     ========================================================= -->

<button
    type="button"
    id="fabAddOrderBtn"
    onclick="openOrderModal()"
    aria-label="Add new order"
    class="no-print add-order-fab"
>

    <svg
        class="w-7 h-7 sm:w-8 sm:h-8"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
    >

        <path d="M12 5v14"/>
        <path d="M5 12h14"/>

    </svg>

</button>


<script>

/* =========================================================
   OPEN ORDER MODAL
   ========================================================= */

function openOrderModal() {

    const modal =
        document.getElementById(
            'orderFormModal'
        );

    const card =
        document.getElementById(
            'orderFormSection'
        );


    if (!modal || !card) return;


    /* FAB becomes the origin of the paper */

    document.body.classList.add(
        'of-order-open'
    );


    modal.classList.remove(
        'hidden'
    );

    modal.classList.add(
        'flex'
    );


    document.body.style.overflow =
        'hidden';


    card.classList.remove(
        'pm-in'
    );

    card.classList.remove(
        'pm-out'
    );


    requestAnimationFrame(() => {

        modal.classList.add(
            'pm-active'
        );


        requestAnimationFrame(() => {

            card.classList.add(
                'pm-in'
            );

        });

    });


    syncPaidState();

    ofRefreshChipStates();

}


/* =========================================================
   CLOSE ORDER MODAL
   ========================================================= */

function closeOrderModal() {

    closeAllQuickFields();


    const modal =
        document.getElementById(
            'orderFormModal'
        );

    const card =
        document.getElementById(
            'orderFormSection'
        );


    if (!modal || !card) return;


    card.classList.remove(
        'pm-in'
    );

    card.classList.add(
        'pm-out'
    );

    modal.classList.remove(
        'pm-active'
    );


    setTimeout(() => {

        modal.classList.add(
            'hidden'
        );

        modal.classList.remove(
            'flex'
        );

        card.classList.remove(
            'pm-out'
        );


        document.body.classList.remove(
            'of-order-open'
        );


        document.body.style.overflow =
            '';

    }, 360);

}


/* =========================================================
   OUTSIDE CLICK
   ========================================================= */

document
    .getElementById(
        'orderFormModal'
    )
    ?.addEventListener(
        'click',
        function(e) {

            if (
                e.target === this
            ) {

                closeOrderModal();

            }

        }
    );


/* =========================================================
   ESCAPE
   ========================================================= */

document.addEventListener(
    'keydown',
    function(e) {

        if (
            e.key === 'Escape'
        ) {

            closeAllQuickFields();

        }

    }
);


/* =========================================================
   CLOSE ALL QUICK FIELDS
   ========================================================= */

function closeAllQuickFields() {

    document
        .querySelectorAll(
            '.of-floating-field.of-show'
        )
        .forEach(
            el => {

                el.classList.remove(
                    'of-show'
                );

            }
        );


    document
        .querySelectorAll(
            '.of-chip.of-open'
        )
        .forEach(
            el => {

                el.classList.remove(
                    'of-open'
                );

            }
        );


    const background =
        document.getElementById(
            'ofFormBackground'
        );


    if (background) {

        background.classList.remove(
            'of-background-blur'
        );

    }

}


/* =========================================================
   CLOSE ONE QUICK FIELD
   ========================================================= */

function closeQuickField(
    key
) {

    const field =
        document.getElementById(
            'ofFloat-' + key
        );


    const chip =
        document.querySelector(
            `.of-chip[data-field="${key}"]`
        );


    if (field) {

        field.classList.remove(
            'of-show'
        );

    }


    if (chip) {

        chip.classList.remove(
            'of-open'
        );

    }


    const background =
        document.getElementById(
            'ofFormBackground'
        );


    if (
        background &&
        !document.querySelector(
            '.of-floating-field.of-show'
        )
    ) {

        background.classList.remove(
            'of-background-blur'
        );

    }

}


/* =========================================================
   QUICK ACTION
   ========================================================= */

function ofQuickAction(
    key
) {


    /* SOURCE */

    if (
        key === 'source'
    ) {

        closeAllQuickFields();


        const chip =
            document.querySelector(
                '.of-chip[data-field="source"]'
            );


        if (chip) {

            chip.classList.add(
                'of-open'
            );

        }


        openSourcePicker(
            'sourceTriggerBtn',
            'sourceHidden',
            '订单来源选择 (Select Source)'
        );


        return;

    }


    /* DATE */

    if (
        key === 'date'
    ) {

        closeAllQuickFields();


        const chip =
            document.querySelector(
                '.of-chip[data-field="date"]'
            );


        if (chip) {

            chip.classList.add(
                'of-open'
            );

        }


        openDeliveryDateWheelPicker(
            'deliveryTriggerBtn',
            'dateHidden',
            'timeHidden'
        );


        return;

    }


    /* FLOATING FIELD */

    const field =
        document.getElementById(
            'ofFloat-' + key
        );


    const chip =
        document.querySelector(
            `.of-chip[data-field="${key}"]`
        );


    if (!field || !chip) return;


    const wasOpen =
        field.classList.contains(
            'of-show'
        );


    closeAllQuickFields();


    if (wasOpen) {

        return;

    }


    field.classList.add(
        'of-show'
    );

    chip.classList.add(
        'of-open'
    );


    /* BLUR EVERYTHING BEHIND */

    const background =
        document.getElementById(
            'ofFormBackground'
        );


    if (background) {

        background.classList.add(
            'of-background-blur'
        );

    }


    /* FOCUS FIELD */

    setTimeout(() => {

        const input =
            field.querySelector(
                'input:not([type="hidden"]):not([type="checkbox"]), textarea, select'
            );


        if (input) {

            input.focus();

        }

    }, 80);

}


/* =========================================================
   CHIP FILLED STATE
   ========================================================= */

function ofSetFilled(
    key,
    filled
) {

    const chip =
        document.querySelector(
            `.of-chip[data-field="${key}"]`
        );


    if (chip) {

        chip.classList.toggle(
            'of-filled',
            !!filled
        );

    }

}


/* =========================================================
   REFRESH CHIP STATES
   ========================================================= */

function ofRefreshChipStates() {


    /* SOURCE */

    const source =
        document.getElementById(
            'sourceHidden'
        );


    ofSetFilled(
        'source',
        !!(
            source &&
            source.value
        )
    );


    /* CUSTOMER */

    const customer =
        document.getElementById(
            'ofCustomerInput'
        );


    ofSetFilled(
        'customer',
        !!(
            customer &&
            customer.value.trim()
        )
    );


    /* ADDRESS */

    const address =
        document.getElementById(
            'ofAddressInput'
        );


    ofSetFilled(
        'address',
        !!(
            address &&
            address.value.trim()
        )
    );


    /* DATE */

    const date =
        document.getElementById(
            'dateHidden'
        );


    ofSetFilled(
        'date',
        !!(
            date &&
            date.value
        )
    );


    /* FEE */

    const fee =
        document.getElementById(
            'ofFeeInput'
        );


    ofSetFilled(
        'fee',
        !!(
            fee &&
            fee.value.trim()
        )
    );


    /* PAYMENT */

    const paid =
        document.getElementById(
            'isPaidCheckbox'
        );


    const paymentChip =
        document.querySelector(
            '.of-payment-chip'
        );


    const paymentChipText =
        document.querySelector(
            '.of-payment-chip-text'
        );


    if (paid) {

        const isPaid =
            paid.checked;


        if (paymentChip) {

            paymentChip.classList.toggle(
                'of-paid',
                isPaid
            );

            paymentChip.classList.toggle(
                'of-filled',
                isPaid
            );

        }


        if (paymentChipText) {

            paymentChipText.textContent =
                isPaid
                    ? '已付款'
                    : '未付款';

        }

    }

}


/* =========================================================
   MARK AS PAID
   ========================================================= */

function toggleMarkPaid() {

    const checkbox =
        document.getElementById(
            'isPaidCheckbox'
        );


    if (!checkbox) return;


    checkbox.checked =
        !checkbox.checked;


    syncPaidState();

}


/* =========================================================
   SYNC PAID STATE
   ========================================================= */

function syncPaidState() {

    const checkbox =
        document.getElementById(
            'isPaidCheckbox'
        );


    if (!checkbox) return;


    const button =
        document.getElementById(
            'markPaidBtn'
        );


    const buttonText =
        document.getElementById(
            'markPaidText'
        );


    const paymentDateWrap =
        document.getElementById(
            'paymentDateWrap'
        );


    const chip =
        document.querySelector(
            '.of-payment-chip'
        );


    const chipText =
        document.querySelector(
            '.of-payment-chip-text'
        );


    const paid =
        checkbox.checked;


    /* BUTTON */

    if (button) {

        button.classList.toggle(
            'of-paid',
            paid
        );

    }


    if (buttonText) {

        buttonText.textContent =
            paid
                ? 'Paid ✓'
                : 'Mark as Paid';

    }


    /* CHIP */

    if (chip) {

        chip.classList.toggle(
            'of-paid',
            paid
        );

        chip.classList.toggle(
            'of-filled',
            paid
        );

    }


    if (chipText) {

        chipText.textContent =
            paid
                ? '已付款'
                : '未付款';

    }


    /* PAYMENT DATE */

    if (paymentDateWrap) {

        paymentDateWrap.classList.toggle(
            'hidden',
            !paid
        );

    }


    ofRefreshChipStates();

}


/* =========================================================
   CLICK OUTSIDE QUICK AREA
   ========================================================= */

document.addEventListener(
    'click',
    function(e) {

        const wrap =
            document.getElementById(
                'ofQuickWrap'
            );


        if (!wrap) return;


        if (
            !wrap.contains(
                e.target
            )
        ) {

            closeAllQuickFields();

        }

    }
);


/* =========================================================
   PICKER OBSERVERS
   ========================================================= */

document.addEventListener(
    'DOMContentLoaded',
    function() {


        [
            'sourceTriggerBtn',
            'deliveryTriggerBtn',
            'paymentDateTriggerBtn'
        ]
        .forEach(
            function(id) {

                const btn =
                    document.getElementById(
                        id
                    );


                if (!btn) return;


                const span =
                    btn.querySelector(
                        'span'
                    );


                if (!span) return;


                new MutationObserver(
                    function() {

                        ofRefreshChipStates();

                    }
                )
                .observe(
                    span,
                    {
                        childList: true,
                        characterData: true,
                        subtree: true
                    }
                );

            }
        );


        [
            'sourceHidden',
            'dateHidden',
            'timeHidden',
            'paymentDateHidden'
        ]
        .forEach(
            function(id) {

                const input =
                    document.getElementById(
                        id
                    );


                if (!input) return;


                input.addEventListener(
                    'change',
                    ofRefreshChipStates
                );

            }
        );


        syncPaidState();

        ofRefreshChipStates();

    }
);


/* =========================================================
   DEFAULT DELIVERY DATE
   ========================================================= */

function getLocalISODate() {

    const d =
        new Date();


    return (
        d.getFullYear()
        + '-'
        + String(
            d.getMonth() + 1
        ).padStart(2, '0')
        + '-'
        + String(
            d.getDate()
        ).padStart(2, '0')
    );

}


(function() {

    const dateHidden =
        document.getElementById(
            'dateHidden'
        );


    if (
        dateHidden &&
        !dateHidden.value
    ) {

        dateHidden.value =
            getLocalISODate();

    }

})();


/* =========================================================
   CAKE CALCULATOR
   ========================================================= */

function toggleCakeCalculator(
    btn
) {

    const itemRow =
        btn.closest(
            '.item-row'
        );


    if (!itemRow) return;


    const panel =
        itemRow.querySelector(
            '.cake-calc-panel'
        );


    const boxesWrap =
        panel.querySelector(
            '.cake-calc-boxes'
        );


    const isHidden =
        panel.classList.contains(
            'hidden'
        );


    if (isHidden) {

        if (
            boxesWrap.children.length === 0
        ) {

            addCalcBoxRow(
                boxesWrap
            );

            addCalcBoxRow(
                boxesWrap
            );

        }


        panel.classList.remove(
            'hidden'
        );


        btn.classList.add(
            'of-active'
        );

    } else {

        panel.classList.add(
            'hidden'
        );


        btn.classList.remove(
            'of-active'
        );

    }

}


/* =========================================================
   ITEM MORE
   ========================================================= */

function toggleItemMore(
    btn
) {

    const itemRow =
        btn.closest(
            '.item-row'
        );


    if (!itemRow) return;


    const panel =
        itemRow.querySelector(
            '.of-item-more-panel'
        );


    if (!panel) return;


    const isOpen =
        panel.classList.toggle(
            'of-open'
        );


    btn.classList.toggle(
        'of-active',
        isOpen
    );

}


/* =========================================================
   CALCULATOR ROW
   ========================================================= */

function addCalcBoxRow(
    boxesWrap
) {

    const idx =
        boxesWrap.children.length + 1;


    const row =
        document.createElement(
            'div'
        );


    row.className =
        'flex items-center gap-1.5';


    row.innerHTML = `

        <span
            class="cake-calc-box-label text-[10px] text-stone-400 w-10 shrink-0"
        >
            第${idx}层
        </span>

        <input
            type="number"
            placeholder="MMK"
            class="cake-calc-box-input flex-1 border border-stone-300 rounded p-1.5 text-xs bg-white outline-none focus:border-emerald-500"
            oninput="recalcCakeTotal(this.closest('.item-row'))"
        >

        <button
            type="button"
            onclick="removeCalcBox(this)"
            class="text-rose-400 hover:text-rose-600 text-xs font-bold px-1 cursor-pointer"
        >
            ✕
        </button>

    `;


    boxesWrap.appendChild(
        row
    );

}


function addCalcBox(
    btn
) {

    const itemRow =
        btn.closest(
            '.item-row'
        );


    const boxes =
        itemRow.querySelector(
            '.cake-calc-boxes'
        );


    addCalcBoxRow(
        boxes
    );

}


function removeCalcBox(
    btn
) {

    const itemRow =
        btn.closest(
            '.item-row'
        );


    btn.parentElement.remove();


    renumberCalcBoxes(
        itemRow
    );


    recalcCakeTotal(
        itemRow
    );

}


function renumberCalcBoxes(
    itemRow
) {

    const boxes =
        itemRow.querySelector(
            '.cake-calc-boxes'
        );


    Array
        .from(
            boxes.children
        )
        .forEach(
            (row, i) => {

                const label =
                    row.querySelector(
                        '.cake-calc-box-label'
                    );


                if (label) {

                    label.textContent =
                        `第${i + 1}层`;

                }

            }
        );

}


function recalcCakeTotal(
    itemRow
) {

    if (!itemRow) return;


    let total = 0;


    itemRow
        .querySelectorAll(
            '.cake-calc-box-input'
        )
        .forEach(
            input => {

                total +=
                    parseFloat(
                        input.value
                    ) || 0;

            }
        );


    const priceInput =
        itemRow.querySelector(
            '.item-price-input'
        );


    if (priceInput) {

        priceInput.value =
            total || '';

    }


    const totalLabel =
        itemRow.querySelector(
            '.cake-calc-total'
        );


    if (totalLabel) {

        totalLabel.textContent =
            `合计: ${total.toLocaleString()} MMK`;

    }

}


function closeCakeCalculator(
    btn
) {

    const itemRow =
        btn.closest(
            '.item-row'
        );


    const panel =
        itemRow.querySelector(
            '.cake-calc-panel'
        );


    panel.classList.add(
        'hidden'
    );


    const calcButton =
        itemRow.querySelector(
            '.of-item-icon-btn'
        );


    if (calcButton) {

        calcButton.classList.remove(
            'of-active'
        );

    }

}


/* =========================================================
   REMOVE ITEM
   ========================================================= */

function removeItemRow(
    btn
) {

    const row =
        btn.closest(
            '.item-row'
        );


    const container =
        document.getElementById(
            'itemsContainer'
        );


    if (!container) return;


    const rows =
        container.querySelectorAll(
            '.item-row'
        );


    if (
        rows.length <= 1
    ) {

        row
            .querySelectorAll(
                'input'
            )
            .forEach(
                input => {

                    if (
                        input.type !== 'file'
                    ) {

                        input.value =
                            '';

                    }

                }
            );


        return;

    }


    row.remove();

}

/* =========================================================
   FORM SUBMIT
   ========================================================= */

function handleFormSubmit(
    event
) {

    event.preventDefault();


    const form =
        event.target;


    const returnQsInput =
        form.querySelector(
            'input[name="return_qs"]'
        );


    if (returnQsInput) {

        try {

            if (
                typeof mcBuildReturnQS ===
                'function'
            ) {

                returnQsInput.value =
                    mcBuildReturnQS();

            } else {

                returnQsInput.value =
                    window.location.search
                        .replace(
                            /^\?/,
                            ''
                        );

            }

        } catch (err) {

            console.warn(
                'Could not build return query:',
                err
            );

        }

    }


    try {

        if (
            typeof mcSaveClientFilters ===
            'function'
        ) {

            mcSaveClientFilters();

        }

    } catch (err) {

        console.warn(
            'Could not save client filters:',
            err
        );

    }


    const submitBtn =
        form.querySelector(
            'button[type="submit"]'
        );


    if (submitBtn) {

        submitBtn.disabled =
            true;

        submitBtn.textContent =
            '图片处理中，请稍候...';

    }


    if (
        typeof mcCompressAndSubmit ===
        'function'
    ) {

        mcCompressAndSubmit(
            form
        );

    } else {

        form.submit();

    }

}
