<!-- =========================================================
     MANAGER ORDER ENTRY — ULTRA COMPACT QUICK-ACTION EDITION
     ========================================================= -->

<style>
/* =========================================================
   MODAL
   ========================================================= */

#orderFormModal {
    position: fixed;
    inset: 0;
    z-index: 9990;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 12px;
    background: rgba(28, 25, 23, 0.42);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
}

#orderFormModal.show {
    display: flex;
}

#orderFormSection {
    width: min(720px, 100%);
    max-height: calc(100vh - 24px);
    overflow-y: auto;
    overflow-x: hidden;

    background: rgba(255,255,255,.96);
    border: 1px solid rgba(255,255,255,.85);
    border-radius: 22px;

    box-shadow:
        0 28px 80px rgba(28,25,23,.22),
        0 8px 25px rgba(28,25,23,.10);

    scrollbar-width: thin;
    scrollbar-color: rgba(120,113,108,.35) transparent;

    animation: orderModalIn .18s ease-out;
}

@keyframes orderModalIn {
    from {
        opacity: 0;
        transform: translateY(8px) scale(.985);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


/* =========================================================
   HEADER
   ========================================================= */

.of-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;

    padding: 12px 14px 9px;
}

.of-title {
    font-size: 14px;
    font-weight: 800;
    color: #292524;
    letter-spacing: -.01em;
}

.of-close {
    width: 30px;
    height: 30px;
    flex: 0 0 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 0;
    border-radius: 10px;
    background: #f5f5f4;
    color: #78716c;

    cursor: pointer;
    transition: .15s ease;
}

.of-close:hover {
    background: #e7e5e4;
    color: #292524;
}


/* =========================================================
   QUICK ACTION BAR
   ========================================================= */

.of-quick-wrap {
    position: relative;
    z-index: 500;

    padding: 0 12px 9px;
}

.of-quick-row {
    display: flex;
    align-items: center;
    gap: 6px;

    width: 100%;
    overflow-x: auto;
    overflow-y: visible;

    padding: 2px;

    scrollbar-width: none;
}

.of-quick-row::-webkit-scrollbar {
    display: none;
}


/* =========================================================
   CHIPS
   ========================================================= */

.of-chip {
    position: relative;

    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;

    min-height: 31px;
    padding: 0 9px;

    border: 1px solid #e7e5e4;
    border-radius: 10px;

    background: rgba(250,250,249,.94);
    color: #57534e;

    font-size: 10px;
    font-weight: 700;
    white-space: nowrap;

    cursor: pointer;

    transition:
        background .15s ease,
        border-color .15s ease,
        color .15s ease,
        transform .15s ease,
        box-shadow .15s ease;
}

.of-chip:hover {
    background: #fff;
    border-color: #d6d3d1;
    color: #292524;
    transform: translateY(-1px);
}

.of-chip.active {
    background: #292524;
    border-color: #292524;
    color: #fff;
    box-shadow: 0 4px 12px rgba(28,25,23,.16);
}

.of-chip.complete {
    border-color: #d6d3d1;
}

.of-chip svg {
    width: 13px;
    height: 13px;
    flex: 0 0 13px;
}

.of-chip-text {
    max-width: 90px;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* =========================================================
   HIDDEN PICKER PROXIES
   IMPORTANT:
   Keep the actual picker trigger buttons in the DOM because
   the existing picker JS may depend on them.
   ========================================================= */

.of-picker-proxy {
    position: absolute !important;

    width: 1px !important;
    height: 1px !important;

    padding: 0 !important;
    margin: 0 !important;

    opacity: 0 !important;
    overflow: hidden !important;

    pointer-events: none !important;

    border: 0 !important;
}


/* =========================================================
   FLOATING QUICK FIELDS
   ========================================================= */

.of-floating-field {
    position: absolute;
    left: 10px;
    right: 10px;
    top: 39px;

    z-index: 1000;

    display: none;

    padding: 11px;

    background: rgba(255,255,255,.98);

    border: 1px solid rgba(214,211,209,.95);
    border-radius: 15px;

    box-shadow:
        0 22px 55px rgba(28,25,23,.20),
        0 6px 18px rgba(28,25,23,.10);

    animation: quickFieldIn .16s ease-out;
}

.of-floating-field.show {
    display: block;
}

@keyframes quickFieldIn {
    from {
        opacity: 0;
        transform: translateY(-5px) scale(.985);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.of-floating-label {
    display: block;

    margin: 0 0 5px 2px;

    font-size: 9px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;

    color: #78716c;
}

.of-floating-input {
    width: 100%;
    height: 37px;

    padding: 0 11px;

    border: 1px solid #e7e5e4;
    border-radius: 10px;

    outline: none;

    background: #fafaf9;
    color: #292524;

    font-size: 13px;
    font-weight: 600;

    transition: .15s ease;
}

.of-floating-input:focus {
    background: #fff;
    border-color: #a8a29e;

    box-shadow:
        0 0 0 3px rgba(168,162,158,.13);
}


/* =========================================================
   TWO-COLUMN FLOATING FIELD
   ========================================================= */

.of-floating-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
}


/* =========================================================
   FORM BACKGROUND
   THIS is what gets blurred.
   ========================================================= */

.of-form-background {
    position: relative;

    transition:
        filter .22s ease,
        opacity .22s ease,
        transform .22s ease;
}


/*
   When a quick field is active:
   blur EVERYTHING behind it — including cake name,
   size, price, remarks, etc.
*/
#orderEntryForm.of-focus-mode .of-form-background {
    filter: blur(5px);
    opacity: .32;
    transform: scale(.995);

    pointer-events: none;
}


/* Keep quick bar crisp */
#orderEntryForm.of-focus-mode .of-quick-wrap {
    opacity: 1;
    filter: none;
}


/* =========================================================
   ITEMS SECTION
   ========================================================= */

.of-items-section {
    padding: 0 12px 8px;
}

.of-items-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 6px;
}

.of-section-title {
    font-size: 10px;
    font-weight: 800;
    color: #78716c;

    text-transform: uppercase;
    letter-spacing: .08em;
}


/* =========================================================
   ITEM CARD
   ========================================================= */

.of-item {
    position: relative;

    padding: 8px;

    margin-bottom: 6px;

    border: 1px solid #e7e5e4;
    border-radius: 13px;

    background: #fafaf9;
}

.of-item:last-child {
    margin-bottom: 0;
}

.of-item-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.8fr) minmax(90px, .75fr) 82px 30px;
    gap: 6px;
    align-items: center;
}

.of-item-input,
.of-item-select {
    width: 100%;
    height: 32px;

    padding: 0 8px;

    border: 1px solid #e7e5e4;
    border-radius: 8px;

    outline: none;

    background: #fff;
    color: #292524;

    font-size: 11px;
    font-weight: 600;

    min-width: 0;
}

.of-item-input:focus,
.of-item-select:focus {
    border-color: #a8a29e;

    box-shadow:
        0 0 0 2px rgba(168,162,158,.10);
}

.of-price-wrap {
    position: relative;
}

.of-price-input {
    padding-left: 8px;
    padding-right: 8px;
    text-align: right;
}

.of-remove-item {
    width: 30px;
    height: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 0;
    border-radius: 8px;

    background: #f5f5f4;
    color: #a8a29e;

    cursor: pointer;

    transition: .15s ease;
}

.of-remove-item:hover {
    background: #fee2e2;
    color: #dc2626;
}

.of-remove-item svg {
    width: 14px;
    height: 14px;
}


/* =========================================================
   ITEM EXTRA BUTTONS
   ========================================================= */

.of-item-extra {
    display: flex;
    align-items: center;
    gap: 5px;

    margin-top: 6px;
}

.of-mini-btn {
    height: 27px;

    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;

    padding: 0 8px;

    border: 1px solid #e7e5e4;
    border-radius: 8px;

    background: #fff;
    color: #78716c;

    font-size: 9px;
    font-weight: 700;

    cursor: pointer;

    transition: .15s ease;
}

.of-mini-btn:hover {
    border-color: #d6d3d1;
    color: #292524;
    background: #fafaf9;
}

.of-mini-btn svg {
    width: 12px;
    height: 12px;
}


/* =========================================================
   REMARKS / IMAGES PANEL
   ========================================================= */

.of-more-panel {
    display: none;

    margin-top: 6px;
    padding: 7px;

    border-radius: 9px;
    background: #f5f5f4;
}

.of-more-panel.show {
    display: block;
}

.of-more-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
}

.of-more-field {
    width: 100%;
    min-height: 30px;

    padding: 6px 8px;

    border: 1px solid #e7e5e4;
    border-radius: 8px;

    outline: none;

    background: #fff;

    font-size: 10px;
}


/* =========================================================
   ADD ITEM
   ========================================================= */

.of-add-item {
    width: 100%;
    height: 31px;

    margin-top: 6px;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;

    border: 1px dashed #d6d3d1;
    border-radius: 9px;

    background: transparent;
    color: #78716c;

    font-size: 10px;
    font-weight: 800;

    cursor: pointer;

    transition: .15s ease;
}

.of-add-item:hover {
    border-color: #a8a29e;
    background: #fafaf9;
    color: #44403c;
}

.of-add-item svg {
    width: 13px;
    height: 13px;
}


/* =========================================================
   BOTTOM ACTIONS
   ========================================================= */

.of-bottom-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;

    padding: 7px 12px 12px;
}

.of-cancel-btn,
.of-submit-btn {
    height: 34px;

    padding: 0 14px;

    border-radius: 9px;

    font-size: 10px;
    font-weight: 800;

    cursor: pointer;

    transition: .15s ease;
}

.of-cancel-btn {
    border: 1px solid #e7e5e4;
    background: #fafaf9;
    color: #78716c;
}

.of-cancel-btn:hover {
    background: #f5f5f4;
    color: #44403c;
}

.of-submit-btn {
    border: 1px solid #292524;
    background: #292524;
    color: #fff;

    box-shadow: 0 4px 12px rgba(28,25,23,.14);
}

.of-submit-btn:hover {
    background: #44403c;
    transform: translateY(-1px);
}


/* =========================================================
   CAKE CALCULATOR
   ========================================================= */

.of-cake-calculator {
    display: none;

    margin-top: 6px;
    padding: 8px;

    border-radius: 10px;
    background: #f5f5f4;
}

.of-cake-calculator.show {
    display: block;
}

.of-layer-row {
    display: grid;
    grid-template-columns: 1fr 75px 28px;
    gap: 5px;

    margin-bottom: 5px;
}

.of-layer-row input,
.of-layer-row select {
    height: 29px;

    padding: 0 7px;

    border: 1px solid #e7e5e4;
    border-radius: 7px;

    background: #fff;
    outline: none;

    font-size: 10px;
}

.of-layer-remove {
    height: 29px;

    border: 0;
    border-radius: 7px;

    background: #fff;
    color: #a8a29e;

    cursor: pointer;
}

.of-layer-total {
    display: flex;
    justify-content: space-between;

    padding-top: 5px;

    border-top: 1px solid #e7e5e4;

    font-size: 10px;
    font-weight: 800;
    color: #57534e;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    #orderFormModal {
        padding: 7px;
        align-items: flex-end;
    }

    #orderFormSection {
        max-height: calc(100vh - 14px);
        border-radius: 19px;
    }

    .of-header {
        padding: 10px 11px 7px;
    }

    .of-title {
        font-size: 13px;
    }

    .of-quick-wrap {
        padding: 0 9px 7px;
    }

    .of-chip {
        min-height: 30px;
        padding: 0 8px;
        font-size: 9px;
    }

    .of-chip-text {
        max-width: 72px;
    }

    .of-floating-field {
        left: 7px;
        right: 7px;
        top: 37px;
    }

    .of-items-section {
        padding: 0 9px 7px;
    }

    .of-item-grid {
        grid-template-columns: minmax(0, 1fr) 75px 70px 28px;
        gap: 4px;
    }

    .of-item-input,
    .of-item-select {
        height: 30px;
        font-size: 10px;
    }

    .of-remove-item {
        width: 28px;
        height: 30px;
    }

    .of-bottom-actions {
        padding: 6px 9px 10px;
    }
}


/* =========================================================
   VERY SHORT SCREEN
   ========================================================= */

@media (max-height: 650px) {

    #orderFormSection {
        max-height: calc(100vh - 10px);
    }

    .of-header {
        padding-top: 7px;
        padding-bottom: 5px;
    }

    .of-quick-wrap {
        padding-bottom: 5px;
    }

    .of-items-section {
        padding-bottom: 5px;
    }

    .of-item {
        padding: 6px;
        margin-bottom: 4px;
    }

    .of-item-extra {
        margin-top: 4px;
    }

    .of-bottom-actions {
        padding-top: 4px;
        padding-bottom: 7px;
    }
}
</style>


<!-- =========================================================
     MODAL
     ========================================================= -->

<div id="orderFormModal">

    <div id="orderFormSection">

        <!-- HEADER -->
        <div class="of-header">

            <div class="of-title">
                新账单快速录入
            </div>

            <button
                type="button"
                class="of-close"
                onclick="closeOrderFormModal()"
                aria-label="Close"
            >
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2">
                    <path d="M6 6l12 12M18 6L6 18"/>
                </svg>
            </button>

        </div>


        <!-- =====================================================
             FORM
             ===================================================== -->

        <form
            id="orderEntryForm"
            method="POST"
            action="/add_order"
            enctype="multipart/form-data"
            onsubmit="handleFormSubmit(event)"
        >

            <input
                type="hidden"
                name="return_qs"
                id="return_qs"
                value=""
            >


            <!-- =================================================
                 QUICK ACTION BAR
                 ================================================= -->

            <div class="of-quick-wrap">

                <div class="of-quick-row">

                    <!-- SOURCE -->
                    <button
                        type="button"
                        id="ofSourceChip"
                        class="of-chip"
                        onclick="ofOpenSource()"
                    >
                        <svg viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2">
                            <path d="M4 7h16M4 12h16M4 17h10"/>
                        </svg>

                        <span
                            id="ofSourceText"
                            class="of-chip-text"
                        >
                            Source
                        </span>
                    </button>


                    <!-- CUSTOMER -->
                    <button
                        type="button"
                        id="ofCustomerChip"
                        class="of-chip"
                        onclick="ofQuickAction('customerField')"
                    >
                        <svg viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="8" r="3"/>
                            <path d="M5 20c.8-4 3.2-6 7-6s6.2 2 7 6"/>
                        </svg>

                        <span
                            id="ofCustomerText"
                            class="of-chip-text"
                        >
                            Customer
                        </span>
                    </button>


                    <!-- ADDRESS -->
                    <button
                        type="button"
                        id="ofAddressChip"
                        class="of-chip"
                        onclick="ofQuickAction('addressField')"
                    >
                        <svg viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2">
                            <path d="M12 21s7-6 7-11a7 7 0 1 0-14 0c0 5 7 11 7 11z"/>
                            <circle cx="12" cy="10" r="2"/>
                        </svg>

                        <span
                            id="ofAddressText"
                            class="of-chip-text"
                        >
                            Address
                        </span>
                    </button>


                    <!-- DATE -->
                    <button
                        type="button"
                        id="ofDateChip"
                        class="of-chip"
                        onclick="ofOpenDate()"
                    >
                        <svg viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="17" rx="2"/>
                            <path d="M16 2v4M8 2v4M3 10h18"/>
                        </svg>

                        <span
                            id="ofDateText"
                            class="of-chip-text"
                        >
                            Date
                        </span>
                    </button>


                    <!-- DELIVERY FEE -->
                    <button
                        type="button"
                        id="ofFeeChip"
                        class="of-chip"
                        onclick="ofQuickAction('feeField')"
                    >
                        <svg viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2">
                            <path d="M3 7h11v10H3z"/>
                            <path d="M14 10h4l3 3v4h-7z"/>
                            <circle cx="7" cy="19" r="1.5"/>
                            <circle cx="18" cy="19" r="1.5"/>
                        </svg>

                        <span
                            id="ofFeeText"
                            class="of-chip-text"
                        >
                            Delivery
                        </span>
                    </button>


                    {% if show_payment %}

                    <!-- PAYMENT -->
                    <button
                        type="button"
                        id="ofPaymentChip"
                        class="of-chip"
                        onclick="ofQuickAction('paymentField')"
                    >
                        <svg viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2">
                            <rect x="3" y="5" width="18" height="14" rx="2"/>
                            <path d="M3 10h18"/>
                        </svg>

                        <span
                            id="ofPaymentText"
                            class="of-chip-text"
                        >
                            Payment
                        </span>
                    </button>

                    {% endif %}

                </div>


                <!-- =================================================
                     FLOATING CUSTOMER FIELD
                     ================================================= -->

                <div
                    id="customerField"
                    class="of-floating-field"
                >

                    <label class="of-floating-label">
                        Customer Name
                    </label>

                    <input
                        type="text"
                        name="customer"
                        id="customerInput"
                        class="of-floating-input"
                        placeholder="Customer name"
                        autocomplete="off"
                        oninput="ofUpdateChip('customer')"
                    >

                </div>


                <!-- =================================================
                     FLOATING ADDRESS FIELD
                     ================================================= -->

                <div
                    id="addressField"
                    class="of-floating-field"
                >

                    <label class="of-floating-label">
                        Delivery Address
                    </label>

                    <input
                        type="text"
                        name="address"
                        id="addressInput"
                        class="of-floating-input"
                        placeholder="Delivery address"
                        autocomplete="off"
                        oninput="ofUpdateChip('address')"
                    >

                </div>


                <!-- =================================================
                     FLOATING DELIVERY FEE
                     ================================================= -->

                <div
                    id="feeField"
                    class="of-floating-field"
                >

                    <label class="of-floating-label">
                        Delivery Fee
                    </label>

                    <input
                        type="number"
                        name="delivery_fee"
                        id="deliveryFeeInput"
                        class="of-floating-input"
                        placeholder="0"
                        min="0"
                        inputmode="numeric"
                        oninput="ofUpdateChip('fee')"
                    >

                </div>


                {% if show_payment %}

                <!-- =================================================
                     FLOATING PAYMENT FIELD
                     ================================================= -->

                <div
                    id="paymentField"
                    class="of-floating-field"
                >

                    <div class="of-floating-grid">

                        <div>
                            <label class="of-floating-label">
                                Payment Method
                            </label>

                            <select
                                name="payment_method"
                                id="paymentMethodInput"
                                class="of-item-select"
                                onchange="ofUpdateChip('payment')"
                            >
                                <option value="">
                                    Select
                                </option>

                                <option value="Cash">
                                    Cash
                                </option>

                                <option value="KPay">
                                    KPay
                                </option>

                                <option value="WavePay">
                                    WavePay
                                </option>

                                <option value="Bank">
                                    Bank
                                </option>

                                <option value="Other">
                                    Other
                                </option>
                            </select>
                        </div>


                        <div>

                            <label class="of-floating-label">
                                Payment Date
                            </label>

                            <button
                                type="button"
                                class="of-item-select"
                                style="cursor:pointer;text-align:left;"
                                onclick="openPaymentDatePickerFromCompact()"
                            >
                                <span id="ofPaymentDateText">
                                    Select date
                                </span>
                            </button>

                        </div>

                    </div>


                    <div style="margin-top:7px;">

                        <label
                            style="
                                display:flex;
                                align-items:center;
                                gap:6px;
                                font-size:10px;
                                font-weight:700;
                                color:#57534e;
                                cursor:pointer;
                            "
                        >

                            <input
                                type="checkbox"
                                name="is_paid"
                                id="isPaidInput"
                                value="1"
                                onchange="ofUpdateChip('payment')"
                            >

                            Mark as paid

                        </label>

                    </div>

                </div>

                {% endif %}


                <!-- =================================================
                     REAL PICKER TRIGGERS
                     IMPORTANT — DO NOT REMOVE
                     ================================================= -->

                <input
                    type="hidden"
                    name="source"
                    id="sourceHidden"
                    value=""
                >

                <button
                    type="button"
                    id="sourceTriggerBtn"
                    class="wp-trigger wp-empty of-picker-proxy"
                    onclick="openSourcePicker(
                        'sourceTriggerBtn',
                        'sourceHidden',
                        '订单来源选择 (Select Source)'
                    )"
                >
                    <span class="text-stone-400">
                        Select Source
                    </span>

                    <svg viewBox="0 0 24 24"
                         fill="none"

<script>

/* =========================================================
   QUICK FIELD HELPERS
   ========================================================= */

function ofCloseQuickFields() {

    const form = document.getElementById('orderEntryForm');

    if (!form) return;

    form.classList.remove('of-focus-mode');


    document
        .querySelectorAll('.of-floating-field')
        .forEach(field => {
            field.classList.remove('show');
        });


    document
        .querySelectorAll('.of-chip')
        .forEach(chip => {
            chip.classList.remove('active');
        });
}


/* =========================================================
   OPEN FLOATING FIELD
   ========================================================= */

function ofQuickAction(fieldId) {

    const form = document.getElementById('orderEntryForm');

    if (!form) return;


    const field = document.getElementById(fieldId);

    if (!field) return;


    const alreadyOpen = field.classList.contains('show');


    ofCloseQuickFields();


    if (alreadyOpen) {
        return;
    }


    field.classList.add('show');

    form.classList.add('of-focus-mode');


    /* Activate corresponding chip */

    const chipMap = {
        customerField: 'ofCustomerChip',
        addressField: 'ofAddressChip',
        feeField: 'ofFeeChip',
        paymentField: 'ofPaymentChip'
    };


    const chipId = chipMap[fieldId];

    if (chipId) {

        const chip = document.getElementById(chipId);

        if (chip) {
            chip.classList.add('active');
        }

    }


    /* Focus input */

    setTimeout(() => {

        const input =
            field.querySelector(
                'input:not([type="checkbox"]), select, textarea'
            );

        if (input) {
            input.focus();
        }

    }, 40);
}


/* =========================================================
   SOURCE PICKER
   ========================================================= */

function ofOpenSource() {

    ofCloseQuickFields();

    const trigger =
        document.getElementById('sourceTriggerBtn');

    if (!trigger) {
        console.warn('sourceTriggerBtn not found');
        return;
    }

    openSourcePicker(
        'sourceTriggerBtn',
        'sourceHidden',
        '订单来源选择 (Select Source)'
    );

}


/* =========================================================
   DATE / TIME PICKER
   ========================================================= */

function ofOpenDate() {

    ofCloseQuickFields();

    const trigger =
        document.getElementById('deliveryTriggerBtn');

    if (!trigger) {
        console.warn('deliveryTriggerBtn not found');
        return;
    }

    openDeliveryDateWheelPicker(
        'deliveryTriggerBtn',
        'dateHidden',
        'timeHidden'
    );

}

   PAYMENT DATE
   ========================================================= */

function openPaymentDatePickerFromCompact() {

    const trigger =
        document.getElementById('paymentDateTriggerBtn');

    if (!trigger) return;


    openDateWheelPicker(
        'paymentDateTriggerBtn',
        'paymentDateHidden'
    );

}


/* =========================================================
   CHIP TEXT UPDATE
   ========================================================= */

function ofUpdateChip(type) {

    let input;
    let text;

    if (type === 'customer') {

        input = document.getElementById('customerInput');
        text = document.getElementById('ofCustomerText');

        if (input && text) {
            text.textContent =
                input.value.trim() || 'Customer';
        }

    }


    if (type === 'address') {

        input = document.getElementById('addressInput');
        text = document.getElementById('ofAddressText');

        if (input && text) {
            text.textContent =
                input.value.trim() || 'Address';
        }

    }


    if (type === 'fee') {

        input = document.getElementById('deliveryFeeInput');
        text = document.getElementById('ofFeeText');

        if (input && text) {

            const value =
                input.value.trim();

            text.textContent =
                value ? `Fee ${value}` : 'Delivery';

        }

    }


    if (type === 'payment') {

        const method =
            document.getElementById('paymentMethodInput');

        const paid =
            document.getElementById('isPaidInput');

        text =
            document.getElementById('ofPaymentText');


        if (text) {

            if (
                paid &&
                paid.checked &&
                method &&
                method.value
            ) {

                text.textContent =
                    method.value;

            } else if (
                paid &&
                paid.checked
            ) {

                text.textContent =
                    'Paid';

            } else {

                text.textContent =
                    'Payment';

            }

        }

    }

}


/* =========================================================
   SOURCE CHIP LABEL SYNC
   ========================================================= */

function ofRefreshSourceChip() {

    const hidden =
        document.getElementById('sourceHidden');

    const text =
        document.getElementById('ofSourceText');

    const trigger =
        document.getElementById('sourceTriggerBtn');


    if (!text) return;


    if (hidden && hidden.value) {

        text.textContent =
            hidden.value;

        document
            .getElementById('ofSourceChip')
            ?.classList.add('complete');

        return;
    }


    if (trigger) {

        const span =
            trigger.querySelector('span');

        if (span) {

            const value =
                span.textContent.trim();

            if (
                value &&
                !value.toLowerCase().includes('select source')
            ) {

                text.textContent =
                    value;

                document
                    .getElementById('ofSourceChip')
                    ?.classList.add('complete');

                return;
            }

        }

    }


    text.textContent = 'Source';

}


/* =========================================================
   DATE CHIP LABEL SYNC
   ========================================================= */

function ofRefreshDateChip() {

    const date =
        document.getElementById('dateHidden');

    const time =
        document.getElementById('timeHidden');

    const text =
        document.getElementById('ofDateText');


    if (!text) return;


    if (date && date.value) {

        let value =
            date.value;

        if (time && time.value) {
            value += ' ' + time.value;
        }

        text.textContent =
            value;

        document
            .getElementById('ofDateChip')
            ?.classList.add('complete');

    } else {

        text.textContent =
            'Date';

    }

}


/* =========================================================
   PAYMENT DATE LABEL SYNC
   ========================================================= */

function ofRefreshPaymentDateChip() {

    const hidden =
        document.getElementById('paymentDateHidden');

    const text =
        document.getElementById('ofPaymentDateText');


    if (!hidden || !text) return;


    if (hidden.value) {

        text.textContent =
            hidden.value;

    } else {

        text.textContent =
            'Select date';

    }

}


/* =========================================================
   REFRESH EVERYTHING
   ========================================================= */

function ofRefreshAll() {

    ofRefreshSourceChip();

    ofRefreshDateChip();

    ofRefreshPaymentDateChip();

    ofUpdateChip('customer');

    ofUpdateChip('address');

    ofUpdateChip('fee');

    ofUpdateChip('payment');

}


/* =========================================================
   CLOSE WHEN CLICKING OUTSIDE QUICK FIELD
   ========================================================= */

document.addEventListener('click', function(event) {

    const form =
        document.getElementById('orderEntryForm');

    if (!form) return;


    if (!form.classList.contains('of-focus-mode')) {
        return;
    }


    const quickWrap =
        event.target.closest('.of-quick-wrap');


    if (quickWrap) {
        return;
    }


    /*
       Don't close if clicking inside picker overlays.
       Existing picker UI may be outside the form.
    */

    const picker =
        event.target.closest(
            '.wp-overlay, .wheel-picker, .picker-overlay, .wp-modal'
        );


    if (picker) {
        return;
    }


    ofCloseQuickFields();

});


/* =========================================================
   ESCAPE CLOSES FLOATING FIELD
   ========================================================= */

document.addEventListener('keydown', function(event) {

    if (event.key !== 'Escape') return;

    ofCloseQuickFields();

});


/* =========================================================
   SOURCE / DATE MUTATION OBSERVER
   Keeps compact chips synced with existing picker JS.
   ========================================================= */

document.addEventListener('DOMContentLoaded', function() {

    [
        'sourceTriggerBtn',
        'deliveryTriggerBtn',
        'paymentDateTriggerBtn'
    ].forEach(function(id) {

        const btn =
            document.getElementById(id);

        if (!btn) return;


        const span =
            btn.querySelector('span');

        if (!span) return;


        new MutationObserver(function() {

            ofRefreshAll();

        }).observe(
            span,
            {
                childList: true,
                characterData: true,
                subtree: true
            }
        );

    });


    [
        'sourceHidden',
        'dateHidden',
        'timeHidden',
        'paymentDateHidden'
    ].forEach(function(id) {

        const input =
            document.getElementById(id);

        if (!input) return;


        input.addEventListener(
            'change',
            ofRefreshAll
        );

    });


    ofRefreshAll();

});

    if (items.length <= 1) {

        const item =

        if (item) {

            item.querySelectorAll('input').forEach(
                input => {
                    input.value = '';

        return;

    const item =
        button.closest('.order-item');

/* =========================================================
   CALCULATE CAKE TOTAL
   ========================================================= */

function calculateCakeTotal(element) {

    const calculator =
        element.closest('.of-cake-calculator')
        ||
        element.closest('.order-item')
            ?.querySelector('.of-cake-calculator');


    if (!calculator) return;


    const prices =
        calculator.querySelectorAll('.layer-price');


    let total = 0;


    prices.forEach(function(input) {

        const value =
            parseFloat(input.value);

        if (!isNaN(value)) {
            total += value;
        }

    });


    const totalElement =
        calculator.querySelector('.cake-total-value');


    if (totalElement) {

        totalElement.textContent =
            total.toLocaleString();

    }


    /*
       Put calculated total into the item's price field.
    */

    const item =
        calculator.closest('.order-item');


    if (item && total > 0) {

        const priceInput =
            item.querySelector('.item-price');

        if (priceInput) {
            priceInput.value = total;
        }

    }

}

/* =========================================================
   FORM SUBMIT
   Keeps your existing compression / return-query logic.
   ========================================================= */

function handleFormSubmit(event) {

    event.preventDefault();


    const form =
        event.target;


    /*
       Keep existing return-query behavior if available.
    */

    try {

        if (
            typeof mcBuildReturnQS === 'function'
        ) {

            const returnInput =
                document.getElementById('return_qs');

            if (returnInput) {

                returnInput.value =
                    mcBuildReturnQS();

            }

        }

    } catch (error) {

        console.warn(
            'Could not build return query:',
            error
        );

    }


    /*
       Keep existing client filter save behavior.
    */

    try {

        if (
            typeof mcSaveClientFilters === 'function'
        ) {

            mcSaveClientFilters();

        }

    } catch (error) {

        console.warn(
            'Could not save client filters:',
            error
        );

    }


    /*
       Use your existing image compression/submission
       function if it exists.
    */

    if (
        typeof mcCompressAndSubmit === 'function'
    ) {

        mcCompressAndSubmit(form);

        return;
    }


    /*
       Fallback.
    */

    form.submit();

}
