{# Manager order entry form - Ultra Compact Quick-Action Edition #}

<style>

/* =========================================================
   MODAL
   ========================================================= */

.of-modal-overlay {
    transition: opacity .22s ease;
    opacity: 0;
}

.of-modal-overlay.pm-active {
    opacity: 1;
}

.of-modal-card {

    transition:
        transform .38s cubic-bezier(.19,1.2,.35,1),
        opacity .25s ease,
        box-shadow .4s ease;
}

.of-modal-card.pm-in {
    transform: perspective(1400px) rotateX(0deg) translateY(0) scale(1);

    box-shadow:
        0 25px 70px rgba(28,25,23,.22),
        0 8px 25px rgba(28,25,23,.10);
}

.of-modal-card.pm-out {
    transform: perspective(1400px) rotateX(8deg) translateY(25px) scale(.97);
    opacity: 0;

}


/* =========================================================
   QUICK ACTION AREA
   ========================================================= */

.of-quick-wrap {
    position: relative;
    z-index: 30;
}

.of-chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
}

.of-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;

    height: 36px;
    padding: 0 11px;

    border-radius: 9999px;
    border: 1px solid #e7e5e4;
    background: #fff;

    font-size: 11.5px;
    font-weight: 700;
    color: #57534e;

    cursor: pointer;
    transition:
        background .15s ease,
        border-color .15s ease,
        color .15s ease,
        transform .15s ease;

    user-select: none;
    white-space: nowrap;
}

.of-chip:hover {
    border-color: #a8a29e;
    background: #fafaf9;
}

.of-chip:active {
    transform: scale(.97);
}

.of-chip-icon {
    font-size: 14px;
    line-height: 1;
}

.of-chip-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #059669;
    display: none;
    margin-left: 1px;
}

.of-chip.of-filled {
    border-color: #a7f3d0;
    background: #ecfdf5;
    color: #047857;
}

.of-chip.of-filled .of-chip-dot {
    display: inline-block;
}

.of-chip.of-open {
    background: #1c1917;
    border-color: #1c1917;
    color: #fff;
}

.of-chip.of-open .of-chip-dot {
    background: #fff;
}


/* =========================================================
   FLOATING INPUT
   Does NOT consume vertical layout space
   ========================================================= */

.of-floating-field {
    position: absolute;
    left: 0;
    top: 43px;

    width: min(430px, calc(100vw - 48px));

    padding: 8px;

    background: rgba(255,255,255,.96);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border: 1px solid rgba(231,229,228,.95);
    border-radius: 14px;

    box-shadow:
        0 16px 35px rgba(28,25,23,.14),
        0 4px 10px rgba(28,25,23,.06);

    opacity: 0;
    transform: translateY(-5px) scale(.98);
    pointer-events: none;

    transition:
        opacity .16s ease,
        transform .16s ease;
}

.of-floating-field.of-show {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
}

.of-floating-label {
    display: block;
    padding: 2px 5px 5px;

    font-size: 9px;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;

    color: #a8a29e;
}

.of-floating-input {

    border: 1px solid #d6d3d1;

    padding: 0 11px;

    outline: none;
}

.of-floating-input:focus {
    border-color: #059669;

}

/* =========================================================

<script>

/* =========================================================
   MODAL
   ========================================================= */

function openOrderModal() {

    const modal = document.getElementById('orderFormModal');
    const card = document.getElementById('orderFormSection');

    modal.classList.remove('hidden');
    modal.classList.add('flex');

    document.body.style.overflow = 'hidden';

    requestAnimationFrame(() => {

        modal.classList.add('pm-active');

        requestAnimationFrame(() => {

            card.classList.remove('pm-out');
            card.classList.add('pm-in');

        });

    });

}


function closeOrderModal() {

    closeAllQuickFields();

    const modal = document.getElementById('orderFormModal');
    const card = document.getElementById('orderFormSection');

    card.classList.remove('pm-in');
    card.classList.add('pm-out');

    modal.classList.remove('pm-active');

    setTimeout(() => {

        modal.classList.add('hidden');
        modal.classList.remove('flex');

        card.classList.remove('pm-out');

        document.body.style.overflow = '';

    }, 200);

}


document
    .getElementById('orderFormModal')
    .addEventListener('click', function(e) {

        if (e.target === this) {
            closeOrderModal();
        }

    });


/* =========================================================
   QUICK ACTIONS
   ========================================================= */

function closeAllQuickFields() {

    document
        .querySelectorAll('.of-floating-field.of-show')
        .forEach(el => el.classList.remove('of-show'));

    document
        .querySelectorAll('.of-chip.of-open')
        .forEach(el => el.classList.remove('of-open'));

}


function closeQuickField(key) {

    const field = document.getElementById('ofFloat-' + key);

    if (field) {
        field.classList.remove('of-show');
    }

    const chip = document.querySelector(
        `.of-chip[data-field="${key}"]`
    );

    if (chip) {
        chip.classList.remove('of-open');
    }

}


function ofQuickAction(key) {

    /*
       Source and Date do NOT create a panel.
       They immediately open the existing picker.
    */

    if (key === 'source') {

        closeAllQuickFields();

        openSourcePicker(
            'sourceTriggerBtn',
            'sourceHidden',
            '订单来源选择 (Select Source)'
        );

        return;
    }


    if (key === 'date') {

        closeAllQuickFields();

        openDeliveryDateWheelPicker(
            'deliveryTriggerBtn',
            'dateHidden',
            'timeHidden'
        );

        return;
    }


    const field = document.getElementById('ofFloat-' + key);
    const chip = document.querySelector(
        `.of-chip[data-field="${key}"]`
    );

    if (!field || !chip) return;


    const wasOpen = field.classList.contains('of-show');

    closeAllQuickFields();


    if (!wasOpen) {

        field.classList.add('of-show');
        chip.classList.add('of-open');


        setTimeout(() => {

            const input = field.querySelector(
                'input[type="text"]'
            );

            if (input) {

                input.focus();

                /*
                   Put cursor at end instead of selecting
                   existing text.
                */

                input.setSelectionRange(
                    input.value.length,
                    input.value.length
                );

            }

        }, 80);

    }

}


/* =========================================================
   CHIP STATE
   ========================================================= */

function ofSetFilled(key, filled) {

    const chip = document.querySelector(
        `.of-chip[data-field="${key}"]`
    );

    if (chip) {
        chip.classList.toggle(
            'of-filled',
            !!filled
        );
    }

}


function ofRefreshChipStates() {

    const sourceHidden =
        document.getElementById('sourceHidden');

    ofSetFilled(
        'source',
        !!(
            sourceHidden &&
            sourceHidden.value
        )
    );


    const customer =
        document.getElementById('ofCustomerInput');

    ofSetFilled(
        'customer',
        !!(
            customer &&
            customer.value.trim()
        )
    );


    const address =
        document.getElementById('ofAddressInput');

    ofSetFilled(
        'address',
        !!(
            address &&
            address.value.trim()
        )
    );


    const dateHidden =
        document.getElementById('dateHidden');

    const timeHidden =
        document.getElementById('timeHidden');

    ofSetFilled(
        'date',
        !!(
            dateHidden &&
            dateHidden.value &&
            timeHidden &&
            timeHidden.value
        )
    );


    const fee =
        document.getElementById('ofFeeInput');

    ofSetFilled(
        'fee',
        !!(
            fee &&
            fee.value.trim()
        )
    );


    const paid =
        document.getElementById('isPaidCheckbox');

    if (paid) {

        ofSetFilled(
            'payment',
            paid.checked
        );

    }

}

   ========================================================= */

document.addEventListener('click', function(e) {

    const wrap =

    if (!wrap) return;

    if (!wrap.contains(e.target)) {

});

function getLocalISODate() {

    const d = new Date();

    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

}


(function initDefaultDeliveryDate() {

    const dateHidden =
        document.getElementById('dateHidden');

    if (
        dateHidden &&
        !dateHidden.value
    ) {

        dateHidden.value =
            getLocalISODate();

    }

})();


/* =========================================================
   CAKE CALCULATOR
   ========================================================= */

function toggleCakeCalculator(btn) {

    const itemRow =
        btn.closest('.item-row');

    const panel =
        itemRow.querySelector('.cake-calc-panel');

    const boxesWrap =
        panel.querySelector('.cake-calc-boxes');

    const isHidden =
        panel.classList.contains('hidden');


    if (isHidden) {

        if (boxesWrap.children.length === 0) {

            addCalcBoxRow(boxesWrap);
            addCalcBoxRow(boxesWrap);

        }

        panel.classList.remove('hidden');
        btn.classList.add('of-active');

    } else {

        panel.classList.add('hidden');
        btn.classList.remove('of-active');

    }

}


function toggleItemMore(btn) {

    const itemRow =
        btn.closest('.item-row');

    const panel =
        itemRow.querySelector('.of-item-more-panel');

    const nowOpen =
        panel.classList.toggle('of-open');

    btn.classList.toggle(
        'of-active',
        nowOpen
    );

}


function addCalcBoxRow(boxesWrap) {

    const idx =
        boxesWrap.children.length + 1;

    const row =
        document.createElement('div');

    row.className =
        'flex items-center gap-1.5';

    row.innerHTML = `

        <span
            class="cake-calc-box-label text-[10px] text-stone-400 w-10 shrink-0">

            第${idx}层

        </span>

        <input
            type="number"
            placeholder="MMK"
            class="cake-calc-box-input flex-1 border border-stone-300 rounded p-1.5 text-xs bg-white outline-none focus:border-emerald-500"
            oninput="recalcCakeTotal(this.closest('.item-row'))">

        <button
            type="button"
            onclick="removeCalcBox(this)"
            class="text-rose-400 hover:text-rose-600 text-xs font-bold px-1 cursor-pointer">

            ✕

        </button>

    `;

    boxesWrap.appendChild(row);

}


function addCalcBox(btn) {

    addCalcBoxRow(
        btn
            .closest('.item-row')
            .querySelector('.cake-calc-boxes')
    );

}


function removeCalcBox(btn) {

    const itemRow =
        btn.closest('.item-row');

    btn.parentElement.remove();

    renumberCalcBoxes(itemRow);

    recalcCakeTotal(itemRow);

}


function renumberCalcBoxes(itemRow) {

    const boxesWrap =
        itemRow.querySelector(
            '.cake-calc-boxes'
        );

    Array.from(
        boxesWrap.children
    ).forEach((row, i) => {

        const label =
            row.querySelector(
                '.cake-calc-box-label'
            );

        if (label) {

            label.textContent =
                `第${i + 1}层`;

        }

    });

}


function recalcCakeTotal(itemRow) {

    if (!itemRow) return;

    let total = 0;

    itemRow
        .querySelectorAll(
            '.cake-calc-box-input'
        )
        .forEach(inp => {

            total +=
                parseFloat(inp.value) || 0;

        });


    const priceInput =
        itemRow.querySelector(
            '.item-price-input'
        );

    if (priceInput) {

        priceInput.value =
            total || '';

    }


    const totalLabel =
        itemRow.querySelector(
            '.cake-calc-total'
        );

    if (totalLabel) {

        totalLabel.textContent =
            `合计: ${total.toLocaleString()} MMK`;

    }

}


function closeCakeCalculator(btn) {

    const itemRow =
        btn.closest('.item-row');

    itemRow
        .querySelector('.cake-calc-panel')
        .classList.add('hidden');

    const calcButton =
        itemRow.querySelector(
            '.of-item-icon-btn'
        );

    if (calcButton) {

        calcButton.classList.remove(
            'of-active'
        );

    }

}


/* =========================================================
   REMOVE ITEM
   ========================================================= */

function removeItemRow(btn) {

    const row =
        btn.closest('.item-row');

    const container =
        document.getElementById(
            'itemsContainer'
        );


    /*
       Always keep at least one item row.
    */

    if (
        container &&
        container.querySelectorAll('.item-row').length <= 1
    ) {

        const inputs =
            row.querySelectorAll('input');

        inputs.forEach(input => {

            if (input.type === 'file') {

                input.value = '';

            } else {

                input.value = '';

            }

        });

        return;

    }


    row.remove();

}

function handleFormSubmit(event) {

    event.preventDefault();

    const form =
        event.target;


    const returnQsInput =
        form.querySelector(
            'input[name="return_qs"]'
        );


    if (returnQsInput) {

        returnQsInput.value =
            window.mcBuildReturnQS
                ? window.mcBuildReturnQS()
                : window.location.search.replace(/^\?/, '');

    }


    if (
        window.mcSaveClientFilters
    ) {

        window.mcSaveClientFilters();

    }


    const submitBtn =
        form.querySelector(
            'button[type="submit"]'
        );


    if (submitBtn) {

        submitBtn.disabled = true;

        submitBtn.textContent =
            '图片处理中，请稍候...';

    }


    mcCompressAndSubmit(form)
        .catch((err) => {

            console.error(
                'Image compression failed, submitting originals:',
                err
            );

            form.submit();

        });

}
