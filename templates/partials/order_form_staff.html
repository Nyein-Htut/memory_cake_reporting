<style>

/* =========================================================
   ORDER MODAL — STAFF
   ========================================================= */

.of-modal-overlay {
    transition: opacity .25s ease;
    opacity: 0;
}

.of-modal-overlay.pm-active {
    opacity: 1;
}


/* =========================================================
   PAPER OPEN / CLOSE ANIMATION
   ========================================================= */

.of-modal-card {
    transform:
        perspective(1400px)
        rotateX(-14deg)
        translateY(46px)
        scale(.92);

    opacity: 0;

    transform-origin: top center;

    transition:
        transform .5s cubic-bezier(.19,1.2,.35,1),
        opacity .35s ease,
        box-shadow .5s ease;
}

.of-modal-card.pm-in {
    transform:
        perspective(1400px)
        rotateX(0deg)
        translateY(0)
        scale(1);

    opacity: 1;

    box-shadow:
        0 30px 80px rgba(28,25,23,.28),
        0 10px 30px rgba(28,25,23,.12);
}

.of-modal-card.pm-out {
    transform:
        perspective(1400px)
        rotateX(10deg)
        translateY(30px)
        scale(.94);

    opacity: 0;

    transition:
        transform .22s ease,
        opacity .18s ease;
}


/* =========================================================
   CHIP ROW
   ========================================================= */

.of-chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
}

.of-chip {
    display: flex;
    align-items: center;
    gap: 6px;

    padding: 11px 15px;

    border-radius: 9999px;

    border: 1.5px solid #e7e5e4;
    background: #fff;

    font-size: 12.5px;
    font-weight: 700;
    color: #57534e;

    cursor: pointer;

    transition:
        all .2s ease;

    user-select: none;
}

.of-chip:hover {
    border-color: #a8a29e;
}

.of-chip-icon {
    font-size: 16px;
    line-height: 1;
}

.of-chip-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #059669;

    display: none;
}

.of-chip.of-filled {
    border-color: #a7f3d0;
    background: #ecfdf5;
    color: #047857;
}

.of-chip.of-filled .of-chip-dot {
    display: inline-block;
}

.of-chip.of-open {
    border-color: #1c1917;
    background: #1c1917;
    color: #fff;
}

.of-chip.of-open .of-chip-dot {
    background: #fff;
}


/* =========================================================
   INDIVIDUAL FIELD PANELS
   ========================================================= */

.of-panel {
    overflow: hidden;

    max-height: 0;
    opacity: 0;

    margin-top: 0;

    transition:
        max-height .32s cubic-bezier(.2,.8,.2,1),
        opacity .25s ease,
        margin-top .3s ease;
}

.of-panel.of-panel-open {
    max-height: 260px;
    opacity: 1;

    margin-top: 10px;
}

.of-panel-inner {
    background: #fafaf9;

    border: 1px solid #f0efed;

    border-radius: 14px;

    padding: 14px 15px;
}

.of-panel-label {
    font-size: 10.5px;
    font-weight: 700;

    letter-spacing: .05em;
    text-transform: uppercase;

    color: #a8a29e;

    margin-bottom: 7px;

    display: block;
}


/* =========================================================
   FIELD INPUTS
   ========================================================= */

.of-panel input[type="text"] {
    transition:
        border-color .18s ease,
        box-shadow .18s ease,
        transform .18s ease;
}

.of-panel input[type="text"]:focus {
    border-color: #1c1917;

    box-shadow:
        0 0 0 3px rgba(16,185,129,.08);
}


/* =========================================================
   ITEM CARD
   ========================================================= */

.of-item-card {
    background: #fff;

    border: 1px solid #e7e5e4;

    border-radius: 16px;

    padding: 12px;

    position: relative;

    transition:
        border-color .2s ease,
        box-shadow .2s ease,
        transform .2s ease;
}

.of-item-card:hover {
    border-color: #d6d3d1;

    box-shadow:

}

.of-item-row-main {

    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
}


/* =========================================================
   ITEM INPUTS
   ========================================================= */

.of-item-input {

    border-radius: 9px;

    padding: 9px 11px;

    font-size: 12.5px;

    background: #fff;

        box-shadow .18s ease;
}

.of-item-input:focus {
    border-color: #1c1917;

    box-shadow:
        0 0 0 3px rgba(16,185,129,.08);
}

.of-item-name-input {

}

.of-item-size-input {

}


/* =========================================================
   ITEM ICON BUTTONS
   ========================================================= */

.of-item-icon-btn {

    height: 34px;

    border-radius: 9999px;

    border: 1px solid #e7e5e4;

    background: #fafaf9;

    color: #78716c;

    align-items: center;

}

.of-item-icon-btn:hover {

}

.of-item-icon-btn.of-active {

    border-color: #a7f3d0;

}


/* =========================================================
   REMOVE BUTTON
   ========================================================= */

.of-item-remove-btn {

    border-color: #ffe4e6;

    background: #fff1f2;
}

.of-item-remove-btn:hover {
    background: #ffe4e6;
}


/* =========================================================
   MORE PANEL

   ========================================================= */

.of-item-more-panel {

    padding-top: 10px;

    border-top: 1px dashed #e7e5e4;

    display: block;

/*
 * Clicking the 🖼️ button can still collapse

 */
.of-item-more-panel.of-collapsed {

/* =========================================================
   ADD ORDER FAB
   ========================================================= */

.add-order-fab {

    bottom: max(
        1.1rem,

<script>

/* =========================================================
   OPEN MODAL
   ========================================================= */

function openOrderModal() {

    const modal =
        document.getElementById('orderFormModal');

    const card =
        document.getElementById('orderFormSection');

    if (!modal || !card) return;


    modal.classList.remove('hidden');
    modal.classList.add('flex');

    document.body.style.overflow = 'hidden';


    requestAnimationFrame(() => {

        modal.classList.add('pm-active');

        requestAnimationFrame(() => {

            card.classList.remove('pm-out');

            card.classList.add('pm-in');

        });

    });

}


/* =========================================================
   CLOSE MODAL
   ========================================================= */

function closeOrderModal() {

    const modal =
        document.getElementById('orderFormModal');

    const card =
        document.getElementById('orderFormSection');

    if (!modal || !card) return;


    card.classList.remove('pm-in');

    card.classList.add('pm-out');

    modal.classList.remove('pm-active');


    setTimeout(() => {

        modal.classList.add('hidden');

        modal.classList.remove('flex');

        card.classList.remove('pm-out');

        document.body.style.overflow = '';

    }, 220);

}


/* =========================================================
   CLICK OUTSIDE MODAL
   ========================================================= */

document
    .getElementById('orderFormModal')
    .addEventListener('click', function(e) {

        if (e.target === this) {

            closeOrderModal();

        }

    });


/* =========================================================
   CHIP FIELD ACCORDION
   ========================================================= */

function ofToggleField(key) {

    const panel =
        document.getElementById('ofPanel-' + key);

    if (!panel) return;


    const wasOpen =
        panel.classList.contains('of-panel-open');


    /*
     * Close all other fields
     */

    document
        .querySelectorAll('.of-panel.of-panel-open')
        .forEach(p => {

            p.classList.remove('of-panel-open');

        });


    /*
     * Remove active chip
     */

    document
        .querySelectorAll('.of-chip.of-open')
        .forEach(c => {

            c.classList.remove('of-open');

        });


    /*
     * Open selected field
     */

    if (!wasOpen) {

        panel.classList.add('of-panel-open');


        const chip =
            document.querySelector(
                `.of-chip[data-field="${key}"]`
            );


        if (chip) {

            chip.classList.add('of-open');

        }


        /*
         * Focus normal text field
         */

        const inp =
            panel.querySelector(
                'input[type="text"]'
            );


        if (inp) {

            setTimeout(() => {

                inp.focus();

            }, 260);

        }

    }

}


/* =========================================================
   CHIP FILLED STATE
   ========================================================= */

function ofSetFilled(key, filled) {

    const chip =
        document.querySelector(
            `.of-chip[data-field="${key}"]`
        );

    if (chip) {

        chip.classList.toggle(
            'of-filled',
            !!filled
        );

    }

}


/* =========================================================
   REFRESH CHIP STATES
   ========================================================= */

function ofRefreshChipStates() {

    /* SOURCE */

    const sourceHidden =
        document.getElementById('sourceHidden');

    ofSetFilled(
        'source',
        !!(
            sourceHidden &&
            sourceHidden.value
        )
    );


    /* CUSTOMER */

    const customerInput =
        document.querySelector(
            '#ofPanel-customer [name="customer"]'
        );

    ofSetFilled(
        'customer',
        !!(
            customerInput &&
            customerInput.value.trim()
        )
    );


    /* ADDRESS */

    const addressInput =
        document.querySelector(
            '#ofPanel-address [name="address"]'
        );

    ofSetFilled(
        'address',
        !!(
            addressInput &&
            addressInput.value.trim()
        )
    );


    /* DATE */

    const dateHidden =
        document.getElementById('dateHidden');

    const timeHidden =
        document.getElementById('timeHidden');

    ofSetFilled(
        'date',
        !!(
            dateHidden &&
            dateHidden.value &&
            timeHidden &&
            timeHidden.value
        )
    );


    /* FEE */

    const feeInput =
        document.querySelector(
            '#ofPanel-fee [name="delivery_fee"]'
        );

    ofSetFilled(
        'fee',
        !!(
            feeInput &&
            feeInput.value.trim()
        )
    );

}


/* =========================================================
   WATCH PICKER LABELS
   ========================================================= */

document.addEventListener(
    'DOMContentLoaded',
    function() {

        [
            'sourceTriggerBtn',
            'deliveryTriggerBtn'
        ].forEach(id => {

            const btn =
                document.getElementById(id);

            if (!btn) return;


            const span =
                btn.querySelector('span');

            if (!span) return;


            new MutationObserver(
                ofRefreshChipStates
            ).observe(
                span,
                {
                    childList: true,
                    characterData: true,
                    subtree: true
                }
            );

        });


        ofRefreshChipStates();

    }
);


/* =========================================================
   DEFAULT DELIVERY DATE
   ========================================================= */

function getLocalISODate() {

    const d = new Date();

    return `${d.getFullYear()}-${
        String(d.getMonth() + 1).padStart(2, '0')
    }-${
        String(d.getDate()).padStart(2, '0')
    }`;

}


(function initDefaultDeliveryDate() {

    const dateHidden =
        document.getElementById('dateHidden');

    if (
        dateHidden &&
        !dateHidden.value
    ) {

        dateHidden.value =
            getLocalISODate();


        const span =
            document.querySelector(
                '#deliveryTriggerBtn span'
            );


        if (
            span &&
            typeof wpShortDayLabel === 'function'
        ) {

            span.textContent =
                `${wpShortDayLabel(dateHidden.value)} · --:--`;


            document
                .getElementById('deliveryTriggerBtn')
                .classList
                .remove('wp-empty');

        }

    }

})();


/* =========================================================
   ITEM MORE PANEL
   DEFAULT = OPEN
   ========================================================= */

function toggleItemMore(btn) {

    const itemRow =
        btn.closest('.item-row');

    if (!itemRow) return;


    const panel =
        itemRow.querySelector(
            '.of-item-more-panel'
        );

    if (!panel) return;


    /*
     * Since the panel is visible by default,
     * clicking the image button now COLLAPSES it.
     */

    const isCollapsed =
        panel.classList.toggle('of-collapsed');


    /*
     * Active means the panel is currently visible.
     */

    btn.classList.toggle(
        'of-active',
        !isCollapsed
    );

}


/* =========================================================
   REMOVE ITEM
   ========================================================= */

function removeItemRow(btn) {

    const container =
        document.getElementById('itemsContainer');

    const rows =
        container.querySelectorAll('.item-row');


    /*
     * Keep one row minimum.
     */

    if (rows.length <= 1) {

        const row = rows[0];

        row.querySelectorAll(
            'input[type="text"]'
        ).forEach(input => {

            input.value = '';

        });


        row.querySelectorAll(
            'input[type="file"]'
        ).forEach(input => {

            input.value = '';

        });


        const more =
            row.querySelector(
                '.of-item-more-panel'
            );

        if (more) {

            /*
             * Keep remarks/photos OPEN
             * when resetting the only row.
             */

            more.classList.remove(
                'of-collapsed'
            );

        }


        const moreBtn =
            row.querySelector(
                '.of-item-icon-btn'
            );

        if (moreBtn) {

            moreBtn.classList.remove(
                'of-active'
            );

        }

        return;

    }


    btn.closest('.item-row').remove();

}

/* =========================================================
   FORM SUBMIT
   ========================================================= */

function handleFormSubmit(event) {

    event.preventDefault();


    const form =
        event.target;


    const returnQsInput =
        form.querySelector(
            'input[name="return_qs"]'
        );


    if (returnQsInput) {

        returnQsInput.value =
            window.mcBuildReturnQS

                ? window.mcBuildReturnQS()

                : window.location.search
                    .replace(/^\?/, '');

    }


    if (
        window.mcSaveClientFilters
    ) {

        window.mcSaveClientFilters();

    }


    const submitBtn =
        form.querySelector(
            'button[type="submit"]'
        );


    if (submitBtn) {

        submitBtn.disabled = true;

        submitBtn.textContent =
            'လုပ်ဆောင်နေသည်...';

    }


    /*
     * Keep your existing image
     * compression system.
     */

    if (
        typeof mcCompressAndSubmit ===
        'function'
    ) {

        mcCompressAndSubmit(form)
            .catch((err) => {

                console.error(
                    'Image compression failed, submitting originals:',
                    err
                );

                form.submit();

            });

    } else {

        form.submit();

    }

}
