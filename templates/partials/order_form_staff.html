<style>
.of-modal-overlay { transition: opacity .25s ease; opacity: 0; }
.of-modal-overlay.pm-active { opacity: 1; }
.of-modal-card {
    transform: perspective(1400px) rotateX(-14deg) translateY(46px) scale(.92);
    opacity: 0;
    transform-origin: top center;
    transition: transform .5s cubic-bezier(.19,1.2,.35,1), opacity .35s ease, box-shadow .5s ease;
}
.of-modal-card.pm-in {
    transform: perspective(1400px) rotateX(0deg) translateY(0) scale(1);
    opacity: 1;
    box-shadow: 0 30px 80px rgba(28,25,23,.28), 0 10px 30px rgba(28,25,23,.12);
}
.of-modal-card.pm-out {
    transform: perspective(1400px) rotateX(10deg) translateY(30px) scale(.94);
    opacity: 0;
    transition: transform .22s ease, opacity .18s ease;
}

.of-chip-row { display:flex; flex-wrap:wrap; gap:9px; }
.of-chip {
    display:flex; align-items:center; gap:6px;
    padding:11px 15px; border-radius:9999px;
    border:1.5px solid #e7e5e4; background:#fff;
    font-size:12.5px; font-weight:700; color:#57534e;
    cursor:pointer; transition: all .2s ease; user-select:none;
}
.of-chip:hover { border-color:#a8a29e; }
.of-chip-icon { font-size:16px; line-height:1; }
.of-chip-dot { width:6px; height:6px; border-radius:50%; background:#059669; display:none; }
.of-chip.of-filled { border-color:#a7f3d0; background:#ecfdf5; color:#047857; }
.of-chip.of-filled .of-chip-dot { display:inline-block; }
.of-chip.of-open { border-color:#1c1917; background:#1c1917; color:#fff; }
.of-chip.of-open .of-chip-dot { background:#fff; }

.of-panel {
    overflow:hidden; max-height:0; opacity:0;
    transition: max-height .32s cubic-bezier(.2,.8,.2,1), opacity .25s ease, margin-top .3s ease;
    margin-top:0;
}
.of-panel.of-panel-open { max-height:260px; opacity:1; margin-top:10px; }
.of-panel-inner { background:#fafaf9; border:1px solid #f0efed; border-radius:14px; padding:14px 15px; }
.of-panel-label {
    font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    color:#a8a29e; margin-bottom:7px; display:block;
}

.of-item-card { background:#fff; border:1px solid #e7e5e4; border-radius:16px; padding:12px; position:relative; }
.of-item-row-main { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.of-item-input { border:1px solid #d6d3d1; border-radius:9px; padding:9px 11px; font-size:12.5px; background:#fff; outline:none; }
.of-item-input:focus { border-color:#1c1917; }
.of-item-name-input { flex:2; min-width:110px; }
.of-item-size-input { width:78px; }
.of-item-icon-btn {
    width:34px; height:34px; border-radius:9999px; border:1px solid #e7e5e4;
    background:#fafaf9; color:#78716c; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:14px; flex-shrink:0; transition: all .15s ease;
}
.of-item-icon-btn:hover { background:#f0efed; }
.of-item-icon-btn.of-active { background:#ecfdf5; border-color:#a7f3d0; color:#047857; }
.of-item-remove-btn { color:#e11d48; border-color:#ffe4e6; background:#fff1f2; }
.of-item-remove-btn:hover { background:#ffe4e6; }
.of-item-more-panel { margin-top:10px; padding-top:10px; border-top:1px dashed #e7e5e4; display:none; }
.of-item-more-panel.of-open { display:block; }
</style>

<!-- Modal Overlay Container -->
<div id="orderFormModal" class="fixed inset-0 z-50 hidden bg-emerald-950/40 backdrop-blur-sm no-print flex items-center justify-center p-4 sm:p-6 of-modal-overlay">

    <!-- Modal Box -->
    <section class="bg-white w-full max-w-4xl max-h-[90vh] overflow-y-auto rounded-3xl shadow-2xl border border-stone-200 relative of-modal-card" id="orderFormSection">

        <!-- Modal Header -->
        <div class="sticky top-0 bg-white/95 backdrop-blur-md z-20 px-6 py-5 border-b border-stone-100 flex items-center justify-between">
            <h2 class="section-title text-emerald-850 text-lg font-bold flex items-center gap-2">
                <span class="p-1.5 bg-emerald-100 rounded-xl text-lg">📝</span>
                အော်ဒါအသစ် ထည့်သွင်းရန်
            </h2>
            <button type="button" onclick="closeOrderModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-emerald-50 hover:bg-emerald-100 text-emerald-800 transition-colors cursor-pointer">
                <span class="text-lg font-bold">✕</span>
            </button>
        </div>

        <!-- Form Body -->
        <form action="/add_order" method="POST" enctype="multipart/form-data" onsubmit="handleFormSubmit(event)" class="p-6 space-y-6 text-sm font-sans">
            <input type="hidden" name="return_qs" id="addOrderReturnQs" value="">

            <!-- ===== Icon chip row — tap an icon to reveal just that field ===== -->
            <div class="of-chip-row">
                <button type="button" class="of-chip" data-field="source" onclick="ofToggleField('source')">
                    <span class="of-chip-icon">🏷️</span><span>အော်ဒါလာသည့်နေရာ</span><span class="of-chip-dot"></span>
                </button>
                <button type="button" class="of-chip" data-field="customer" onclick="ofToggleField('customer')">
                    <span class="of-chip-icon">👤</span><span>ဖောက်သည်</span><span class="of-chip-dot"></span>
                </button>
                <button type="button" class="of-chip" data-field="address" onclick="ofToggleField('address')">
                    <span class="of-chip-icon">📍</span><span>လိပ်စာ</span><span class="of-chip-dot"></span>
                </button>
                <button type="button" class="of-chip" data-field="date" onclick="ofToggleField('date')">
                    <span class="of-chip-icon">📅</span><span>ရက်စွဲ/အချိန်</span><span class="of-chip-dot"></span>
                </button>
                <button type="button" class="of-chip" data-field="fee" onclick="ofToggleField('fee')">
                    <span class="of-chip-icon">🚗</span><span>ကားခ</span><span class="of-chip-dot"></span>
                </button>
            </div>

            <div class="of-panel" id="ofPanel-source">
                <div class="of-panel-inner">
                    <span class="of-panel-label">အော်ဒါလာသည့်နေရာ</span>
                    <input type="hidden" name="source" id="sourceHidden" value="">
                    <button type="button" id="sourceTriggerBtn" class="wp-trigger wp-empty text-sm" onclick="openSourcePicker('sourceTriggerBtn','sourceHidden','အော်ဒါလာသည့်နေရာ ရွေးပါ (Select Source)')">
                        <span class="text-stone-400">အော်ဒါလာသည့်နေရာ ရွေးပါ</span>
                        <svg class="w-4 h-4 text-stone-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                    </button>
                </div>
            </div>

            <div class="of-panel" id="ofPanel-customer">
                <div class="of-panel-inner">
                    <span class="of-panel-label">ဖောက်သည်အမည်</span>
                    <input type="text" name="customer" placeholder="အမည်" class="w-full border border-stone-300 rounded-xl p-3 text-sm outline-none focus:border-stone-950 focus:ring-2 focus:ring-emerald-500/10" oninput="ofRefreshChipStates()">
                </div>
            </div>

            <div class="of-panel" id="ofPanel-address">
                <div class="of-panel-inner">
                    <span class="of-panel-label">လိပ်စာ &amp; ဆက်သွယ်ရန်</span>
                    <input type="text" name="address" placeholder="ပို့ဆောင်ရန် လိပ်စာ အသေးစိတ် နှင့် ဖုန်းနံပါတ်" class="w-full border border-stone-300 rounded-xl p-3 text-sm outline-none focus:border-stone-950 focus:ring-2 focus:ring-emerald-500/10" oninput="ofRefreshChipStates()">
                </div>
            </div>

            <div class="of-panel" id="ofPanel-date">
                <div class="of-panel-inner">
                    <span class="of-panel-label">ပေးပို့မည့် ရက်စွဲ &amp; အချိန်</span>
                    <input type="hidden" name="date" id="dateHidden" value="">
                    <input type="hidden" name="time" id="timeHidden" value="">
                    <button type="button" id="deliveryTriggerBtn" class="wp-trigger wp-empty text-sm" onclick="openDeliveryDateWheelPicker('deliveryTriggerBtn','dateHidden','timeHidden')">
                        <span class="text-stone-400">ရက်စွဲ နှင့် အချိန် ရွေးပါ</span>
                        <svg class="w-4 h-4 text-stone-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                    </button>
                </div>
            </div>

            <div class="of-panel" id="ofPanel-fee">
                <div class="of-panel-inner">
                    <span class="of-panel-label">ကားခ</span>
                    <input type="text" name="delivery_fee" placeholder="ကားခ မှတ်ချက် (ဥပမာ 15,000)" class="w-full border border-stone-300 rounded-xl p-3 text-sm outline-none focus:border-stone-950 focus:ring-2 focus:ring-emerald-500/10" oninput="ofRefreshChipStates()">
                </div>
            </div>

            <!-- Items Details -->
            <div class="border-t border-stone-100 pt-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xs font-bold tracking-widest uppercase text-stone-500">ကုန်ပစ္စည်းစာရင်း အသေးစိတ်</h3>
                    <button type="button" onclick="addNewItemRow()" class="text-xs bg-stone-100 hover:bg-stone-200 text-stone-800 font-semibold py-1.5 px-4 rounded-xl transition-all">
                        ➕ ပစ္စည်းအသစ်ထည့်ရန်
                    </button>
                </div>

                <div id="itemsContainer" class="space-y-3">
                    <div class="item-row of-item-card">
                        <div class="of-item-row-main">
                            <input type="text" name="item_name[]" placeholder="ကိတ်မုန့် / ဖယောင်းတိုင် / အချိုပွဲ" class="of-item-input of-item-name-input">
                            <input type="text" name="size[]" placeholder="6in" class="of-item-input of-item-size-input">
                            <button type="button" class="of-item-icon-btn" onclick="toggleItemMore(this)" title="မှတ်ချက် / ပုံ">🖼️</button>
                            <button type="button" class="of-item-icon-btn of-item-remove-btn" onclick="this.closest('.item-row').remove()" title="ဖျက်ရန်">✕</button>
                        </div>
                        <div class="of-item-more-panel">
                            <div class="space-y-2">
                                <input type="text" name="remarks[]" placeholder="ရေးသားချက် လိုအပ်ချက်..." class="of-item-input w-full">
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="block text-stone-500 text-[10px] mb-1 font-semibold">🎂 ကိတ်မုန့် ကိုးကားပုံ</label>
                                        <input type="file" name="cakeImage[]" accept="image/*" class="w-full text-[11px] text-stone-500 file:py-1 file:px-2 file:rounded-lg file:border-0 file:bg-stone-200 file:text-stone-700 cursor-pointer">
                                    </div>
                                    <div>
                                        <label class="block text-rose-600 text-[10px] mb-1 font-semibold">💐 ပန်းစည်း ကိုးကားပုံ</label>
                                        <input type="file" name="flowerImage[]" accept="image/*" class="w-full text-[11px] text-stone-500 file:py-1 file:px-2 file:rounded-lg file:border-0 file:bg-rose-50 file:text-rose-700 cursor-pointer">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sticky Bottom Actions -->
            <div class="flex justify-end pt-4 border-t border-stone-100 gap-3">
                <button type="button" onclick="closeOrderModal()" class="w-full sm:w-auto bg-stone-100 hover:bg-stone-200 text-stone-700 font-sans text-xs uppercase tracking-widest font-semibold py-3.5 px-8 rounded-xl transition-all">
                    ပယ်ဖျက်မည်
                </button>
                <button type="submit" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-sans text-xs uppercase tracking-widest font-semibold py-3.5 px-10 rounded-xl transition-all shadow-md">
                    အော်ဒါ သိမ်းဆည်းမည်
                </button>
            </div>
        </form>
    </section>
</div>

<button type="button"
    id="fabAddOrderBtn"
    onclick="openOrderModal()"
    aria-label="အော်ဒါအသစ် ထည့်ရန်"
    class="no-print add-order-fab"
    style="right: max(1.1rem, env(safe-area-inset-right)); bottom: max(1.1rem, calc(env(safe-area-inset-bottom) + 0.5rem));">
    <svg class="w-7 h-7 sm:w-8 sm:h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
    </svg>
</button>

<script>
    function openOrderModal() {
        const modal = document.getElementById('orderFormModal');
        const card = document.getElementById('orderFormSection');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        document.body.style.overflow = 'hidden';
        requestAnimationFrame(() => {
            modal.classList.add('pm-active');
            requestAnimationFrame(() => {
                card.classList.remove('pm-out');
                card.classList.add('pm-in');
            });
        });
    }

    function closeOrderModal() {
        const modal = document.getElementById('orderFormModal');
        const card = document.getElementById('orderFormSection');
        card.classList.remove('pm-in');
        card.classList.add('pm-out');
        modal.classList.remove('pm-active');
        setTimeout(() => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            card.classList.remove('pm-out');
            document.body.style.overflow = '';
        }, 220);
    }

    document.getElementById('orderFormModal').addEventListener('click', function(e) {
        if (e.target === this) closeOrderModal();
    });

    /* ===== Icon-chip field accordion ===== */
    function ofToggleField(key) {
        const panel = document.getElementById('ofPanel-' + key);
        if (!panel) return;
        const wasOpen = panel.classList.contains('of-panel-open');
        document.querySelectorAll('.of-panel.of-panel-open').forEach(p => p.classList.remove('of-panel-open'));
        document.querySelectorAll('.of-chip.of-open').forEach(c => c.classList.remove('of-open'));
        if (!wasOpen) {
            panel.classList.add('of-panel-open');
            const chip = document.querySelector(`.of-chip[data-field="${key}"]`);
            if (chip) chip.classList.add('of-open');
            const inp = panel.querySelector('input[type="text"]');
            if (inp) setTimeout(() => inp.focus(), 260);
        }
    }

    function ofSetFilled(key, filled) {
        const chip = document.querySelector(`.of-chip[data-field="${key}"]`);
        if (chip) chip.classList.toggle('of-filled', !!filled);
    }

    function ofRefreshChipStates() {
        const sourceHidden = document.getElementById('sourceHidden');
        ofSetFilled('source', !!(sourceHidden && sourceHidden.value));
        const customerInput = document.querySelector('#ofPanel-customer [name="customer"]');
        ofSetFilled('customer', !!(customerInput && customerInput.value.trim()));
        const addressInput = document.querySelector('#ofPanel-address [name="address"]');
        ofSetFilled('address', !!(addressInput && addressInput.value.trim()));
        const dateHidden = document.getElementById('dateHidden');
        const timeHidden = document.getElementById('timeHidden');
        ofSetFilled('date', !!(dateHidden && dateHidden.value && timeHidden && timeHidden.value));
        const feeInput = document.querySelector('#ofPanel-fee [name="delivery_fee"]');
        ofSetFilled('fee', !!(feeInput && feeInput.value.trim()));
    }

    document.addEventListener('DOMContentLoaded', function() {
        ['sourceTriggerBtn', 'deliveryTriggerBtn'].forEach(id => {
            const btn = document.getElementById(id);
            if (!btn) return;
            const span = btn.querySelector('span');
            if (!span) return;
            new MutationObserver(ofRefreshChipStates).observe(span, { childList: true, characterData: true, subtree: true });
        });
        ofRefreshChipStates();
    });

    function handleFormSubmit(event) {
        event.preventDefault();
        const form = event.target;
        const returnQsInput = form.querySelector('input[name="return_qs"]');
        if (returnQsInput) {
            returnQsInput.value = window.mcBuildReturnQS
                ? window.mcBuildReturnQS()
                : window.location.search.replace(/^\?/, '');
        }
        if (window.mcSaveClientFilters) window.mcSaveClientFilters();

        const submitBtn = form.querySelector('button[type="submit"]');
        if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = 'လုပ်ဆောင်နေသည်...';
        }
        mcCompressAndSubmit(form).catch((err) => {
            console.error('Image compression failed, submitting originals:', err);
            form.submit();
        });
    }

    function getLocalISODate() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    (function initDefaultDeliveryDate() {
        const dateHidden = document.getElementById('dateHidden');
        if (dateHidden && !dateHidden.value) {
            dateHidden.value = getLocalISODate();
            const span = document.querySelector('#deliveryTriggerBtn span');
            if (span) {
                span.textContent = `${wpShortDayLabel(dateHidden.value)} · --:--`;
                document.getElementById('deliveryTriggerBtn').classList.remove('wp-empty');
            }
        }
    })();

    function toggleItemMore(btn) {
        const itemRow = btn.closest('.item-row');
        const panel = itemRow.querySelector('.of-item-more-panel');
        const nowOpen = panel.classList.toggle('of-open');
        btn.classList.toggle('of-active', nowOpen);
    }

    function addNewItemRow() {
        const container = document.getElementById('itemsContainer');
        const row = document.createElement('div');
        row.className = 'item-row of-item-card';
        row.innerHTML = `
            <div class="of-item-row-main">
                <input type="text" name="item_name[]" placeholder="ပစ္စည်းအမည်" class="of-item-input of-item-name-input">
                <input type="text" name="size[]" placeholder="အရွယ်အစား" class="of-item-input of-item-size-input">
                <button type="button" class="of-item-icon-btn" onclick="toggleItemMore(this)" title="မှတ်ချက် / ပုံ">🖼️</button>
                <button type="button" class="of-item-icon-btn of-item-remove-btn" onclick="this.closest('.item-row').remove()" title="ဖျက်ရန်">✕</button>
            </div>
            <div class="of-item-more-panel">
                <div class="space-y-2">
                    <input type="text" name="remarks[]" placeholder="မှတ်ချက် လိုအပ်ချက်" class="of-item-input w-full">
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-stone-500 text-[10px] mb-1 font-semibold">🎂 ကိတ်မုန့် ကိုးကားပုံ</label>
                            <input type="file" name="cakeImage[]" accept="image/*" class="w-full text-[11px] text-stone-500 file:py-1 file:px-2 file:rounded-lg file:border-0 file:bg-stone-200 file:text-stone-700 cursor-pointer">
                        </div>
                        <div>
                            <label class="block text-rose-600 text-[10px] mb-1 font-semibold">💐 ပန်းစည်း ကိုးကားပုံ</label>
                            <input type="file" name="flowerImage[]" accept="image/*" class="w-full text-[11px] text-stone-500 file:py-1 file:px-2 file:rounded-lg file:border-0 file:bg-rose-50 file:text-rose-700 cursor-pointer">
                        </div>
                    </div>
                </div>
            </div>
        `;
        container.appendChild(row);
    }
</script>
